<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Online</title>
<meta name="description" content="Halo: Combat Evolved games being played now, carnage reports and service records.">
<link rel="icon" href="/art/types/slayer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<main>
  <h1 class="page-title">Multiplayer</h1>
  <p class="page-sub">Games being hosted right now. Join opens the game and connects through its invite.</p>
  <div class="grid-2">
    <div>
      <section class="panel">
        <h2>Games <span class="note" id="game-count"></span></h2>
        <div id="games"><div class="empty">Looking for games…</div></div>
      </section>
      <section class="panel">
        <h2>Recent Games <span class="note"><a href="/leaders#recent">More</a></span></h2>
        <div id="recent"><div class="empty">Loading…</div></div>
      </section>
    </div>
    <aside>
      <section class="panel">
        <h2>Leaders</h2>
        <div class="tabs" id="leader-tabs"></div>
        <ol class="leaders" id="leaders"><li class="empty">Loading…</li></ol>
      </section>
    </aside>
  </div>
</main>
<script src="/static/site.js"></script>
<script>
frame("games");

async function showGames() {
  const holder = document.getElementById("games");
  try {
    const games = (await getJSON("/v1/games")).games;
    document.getElementById("game-count").textContent = games.length ? games.length + (games.length === 1 ? " game" : " games") : "";
    if (!games.length) { holder.replaceChildren(el("div", { class: "empty", text: "No one is hosting right now. Host a game in the game and it shows here." })); return; }
    holder.replaceChildren(el("div", { class: "games" }, games.map(game => {
      const fill = game.maximum_players ? Math.min(100, Math.round(100 * game.players / game.maximum_players)) : 0;
      return el("div", { class: "game" },
        picture(mapArt(game.map), "shot", mapName(game.map), "/art/maps/unknown.jpg"),
        el("div", {},
          el("div", { class: "name", text: game.name }),
          el("div", { class: "meta" },
            picture(engineArt(game.engine), "type-icon", ""),
            engineName(game.engine, game.teams) + " on " + mapName(game.map) + (game.score_limit ? " · to " + game.score_limit : "")),
          el("div", { class: "seats" },
            el("div", { class: "bar" }, el("div", { class: "fill", style: "width:" + fill + "%" })),
            game.players + "/" + game.maximum_players + " players · ",
            el("span", { class: "state " + (game.open ? "open" : "busy"), text: game.open ? "In the lobby" : "In progress" }))),
        el("a", { class: "join", href: "halo://join/" + game.invite, "aria-disabled": game.open ? null : "true" },
          picture("/art/buttons/a.png", "", ""), "Join"));
    })));
  } catch (error) {
    holder.replaceChildren(el("div", { class: "empty", text: "Could not reach the game list." }));
  }
}

async function showRecent() {
  const holder = document.getElementById("recent");
  try {
    const reports = (await getJSON("/v1/reports?limit=10")).reports;
    if (!reports.length) { holder.replaceChildren(el("div", { class: "empty", text: "No finished games yet." })); return; }
    holder.replaceChildren(el("table", { class: "history" }, el("tbody", {}, reports.map(report =>
      el("tr", { onclick: () => { location.href = "/games/" + report.id; } },
        el("td", { style: "width:66px" }, picture(mapArt(report.map), "thumb", "", "/art/maps/unknown.jpg")),
        el("td", {},
          el("a", { class: "what", href: "/games/" + report.id, text: engineName(report.engine, report.teams) + " on " + mapName(report.map) }),
          el("div", { class: "sub" }, el("span", { class: "place-1", text: report.winner + " won" }),
            " · " + report.player_count + (report.player_count === 1 ? " player" : " players") + " · " + report.host)),
        el("td", { class: "right", text: ago(report.time) }))))));
  } catch (error) {
    holder.replaceChildren(el("div", { class: "empty", text: "Could not load the games played." }));
  }
}

const BOARDS = [["wins", "Wins"], ["kills", "Kills"], ["kd", "K/D"], ["medals", "Medals"]];
let board = "wins";
let leaders = null;
function showBoard() {
  document.getElementById("leader-tabs").replaceChildren(...BOARDS.map(([key, label]) =>
    el("button", { class: key === board ? "here" : "", text: label, onclick: () => { board = key; showBoard(); } })));
  const list = document.getElementById("leaders");
  const rows = leaders ? leaders[board] : [];
  if (!rows || !rows.length) { list.replaceChildren(el("li", { class: "empty", text: leaders ? "No one yet." : "Loading…" })); return; }
  list.replaceChildren(...rows.slice(0, 10).map((row, index) => el("li", {},
    el("span", { class: "rank", text: index + 1 }),
    picture(spartanArt(row.color), "figure", ""),
    el("a", { class: "who", href: playerLink(row.name), text: row.name }),
    el("span", { class: "value", text: board === "kd" ? row.value.toFixed(2) : row.value }))));
}
async function loadLeaders() {
  try { leaders = leaderboards(summarize((await getJSON("/v1/history?limit=500")).reports)); } catch (error) { leaders = {}; }
  showBoard();
}

showGames(); showRecent(); loadLeaders();
setInterval(showGames, 10000);
setInterval(showRecent, 30000);
</script>
</body>
</html>
