<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboards</title>
<link rel="icon" href="/art/types/slayer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<main>
  <h1 class="page-title">Leaderboards</h1>
  <p class="page-sub">Everyone who has finished a game here, over the last 1000 games. Players are told apart by name.</p>
  <div class="grid-2">
    <section class="panel">
      <h2>Leaders</h2>
      <div class="tabs" id="tabs"></div>
      <ol class="leaders" id="board"><li class="empty">Loading…</li></ol>
    </section>
    <section class="panel" id="recent">
      <h2>Game History</h2>
      <div id="history"><div class="empty">Loading…</div></div>
    </section>
  </div>
</main>
<script src="/static/site.js"></script>
<script>
frame("leaders");
const BOARDS = [["wins", "Wins"], ["kills", "Kills"], ["kd", "K/D (3+ games)"], ["medals", "Medals"]];
let board = "wins", boards = null;
function show() {
  document.getElementById("tabs").replaceChildren(...BOARDS.map(([key, label]) =>
    el("button", { class: key === board ? "here" : "", text: label, onclick: () => { board = key; show(); } })));
  const rows = boards ? boards[board] : [];
  document.getElementById("board").replaceChildren(...(rows.length ? rows.slice(0, 50).map((row, index) => el("li", {},
    el("span", { class: "rank", text: index + 1 }), picture(spartanArt(row.color), "figure", ""),
    playerName(row, "who"),
    el("span", { class: "value", text: board === "kd" ? row.value.toFixed(2) : row.value })))
    : [el("li", { class: "empty", text: boards ? "No one yet." : "Loading…" })]));
}
async function load() {
  let reports = [];
  try { reports = (await getJSON("/v1/history?limit=1000")).reports; } catch (error) { }
  boards = leaderboards(summarize(reports));
  show();
  const history = document.getElementById("history");
  if (!reports.length) { history.replaceChildren(el("div", { class: "empty", text: "No finished games yet." })); return; }
  history.replaceChildren(el("table", { class: "history" }, el("tbody", {}, reports.slice(0, 100).map(report =>
    el("tr", { onclick: () => { location.href = "/games/" + report.id; } },
      el("td", { style: "width:66px" }, picture(mapArt(report.map), "thumb", "", "/art/maps/unknown.jpg")),
      el("td", {}, el("a", { class: "what", href: "/games/" + report.id, text: engineName(report.engine, report.teams) + " on " + mapName(report.map) }),
        el("div", { class: "sub" }, el("span", { class: "place-1", text: report.winner + " won" }), " · " + report.players.length + " players")),
      el("td", { class: "right", text: ago(report.time) }))))));
}
show(); load();
</script>
</body>
</html>
