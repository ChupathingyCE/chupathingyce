<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Your Profile</title>
<link rel="icon" href="/art/types/slayer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<main>
  <h1 class="page-title">Profile</h1>
  <div id="profile"><div class="empty">Loading…</div></div>
</main>
<script src="/static/site.js"></script>
<script>
frame("profile");

/* ---------- the key's protection

The password stays in this page. It is stretched (PBKDF2-SHA-256, 600000
rounds, salted with the profile name) into two secrets: one to sign in with,
of which the server keeps only a hash, and one that encrypts the player key
(AES-256-GCM) here, which never leaves the page. The server keeps the
encrypted key alone. */

const ROUNDS = 600000;
const hex = bytes => [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, "0")).join("");
const unhex = text => new Uint8Array(text.match(/../g).map(pair => parseInt(pair, 16)));
async function stretch(password, handle, purpose) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const salt = new TextEncoder().encode("halo-ce-universal " + purpose + "\n" + handle.toLowerCase());
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: ROUNDS }, material, 256));
}
async function secrets(password, handle) {
  const [auth, encryption] = await Promise.all([stretch(password, handle, "sign-in"), stretch(password, handle, "key backup")]);
  const key = await crypto.subtle.importKey("raw", encryption, "AES-GCM", false, ["encrypt", "decrypt"]);
  encryption.fill(0);
  return { auth: hex(auth), key };
}
async function sealKey(playerKey, aesKey, handle) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: new TextEncoder().encode(handle.toLowerCase()) },
    aesKey, unhex(playerKey));
  return { iv: hex(iv), data: hex(data) };
}
async function openKey(backup, aesKey, handle) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unhex(backup.iv), additionalData: new TextEncoder().encode(handle.toLowerCase()) },
    aesKey, unhex(backup.data));
  return hex(plain);
}

async function api(path, body) {
  const response = await fetch(path, { method: body ? "POST" : "GET", cache: "no-store", credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json", "X-Halo": "1" } : {}, body: body ? JSON.stringify(body) : undefined });
  let answer = {};
  try { answer = await response.json(); } catch (error) { }
  if (!response.ok) throw new Error(answer.error || "The server refused (" + response.status + ").");
  return answer;
}

/* ---------- the page */

const holder = document.getElementById("profile");
let state = { playerId: null, profile: null, linked: false, playerKey: null };

function field(label, input, note) {
  return el("label", { class: "field" }, el("span", { class: "label", text: label }), input, note ? el("span", { class: "note", text: note }) : null);
}
function message(text, kind) { return el("div", { class: "message " + (kind || ""), text }); }
function busy(button, text) { button.disabled = true; button.dataset.text = button.textContent; button.textContent = text; }
function idle(button) { button.disabled = false; button.textContent = button.dataset.text || button.textContent; }

function signInForm(note) {
  const handle = el("input", { autocomplete: "username", maxlength: "20", required: true });
  const password = el("input", { type: "password", autocomplete: "current-password", required: true });
  const status = el("div");
  const button = el("button", { class: "join", type: "submit", text: "Sign In" });
  const form = el("form", { class: "panel-body form" },
    note ? message(note) : null,
    field("Profile name", handle), field("Password", password), status, button);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    busy(button, "Signing in…");
    status.replaceChildren();
    try {
      const name = handle.value.trim().toLowerCase();
      const { auth, key } = await secrets(password.value, name);
      const answer = await api("/v1/session/login", { handle: name, auth });
      state = { playerId: answer.player_id, profile: answer.profile, linked: false, playerKey: null };
      try { state.playerKey = await openKey(answer.profile.backup, key, name); }
      catch (error) { state.keyError = "Your key backup could not be read with this password."; }
      password.value = "";
      show();
    } catch (error) {
      status.replaceChildren(message(error.message, "bad"));
      idle(button);
    }
  });
  return el("section", { class: "panel" }, el("h2", { text: "Sign In" }), form,
    el("div", { class: "panel-body dim" },
      "No profile yet? In the game, open Online Play, then the game list (X), and press Y = My Profile. " +
      "That signs you in here as your player, to make one."));
}

function createForm() {
  const handle = el("input", { autocomplete: "username", maxlength: "20", required: true, pattern: "[A-Za-z0-9_-]{3,20}" });
  const display = el("input", { maxlength: "24" });
  const bio = el("textarea", { maxlength: "280", rows: "3" });
  const password = el("input", { type: "password", autocomplete: "new-password", minlength: "10", required: true });
  const again = el("input", { type: "password", autocomplete: "new-password", minlength: "10", required: true });
  const status = el("div");
  const button = el("button", { class: "join", type: "submit", text: "Make My Profile" });
  const form = el("form", { class: "panel-body form" },
    message("You are signed in as player " + state.playerId.slice(0, 8) + ", from the game. Make a profile to keep a backup of your player key: " +
      "with it, a reinstalled game (or another computer) can go on as the same player."),
    field("Profile name", handle, "How you sign in: 3 to 20 letters, digits, - or _. It can't be changed."),
    field("Name shown", display, "Shown on your service record. Your name in the game stays as it is."),
    field("About you", bio),
    field("Password", password, "At least 10 characters. It never leaves this page: if you forget it, your key backup can't be read, by us or anyone."),
    field("Password again", again), status, button);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    status.replaceChildren();
    if (password.value !== again.value) { status.replaceChildren(message("The passwords don't match.", "bad")); return; }
    busy(button, "Protecting your key…");
    try {
      const name = handle.value.trim().toLowerCase();
      const { auth, key } = await secrets(password.value, name);
      const backup = await sealKey(state.playerKey, key, name);
      const answer = await api("/v1/profile", { handle: name, display: display.value.trim(), bio: bio.value.trim(), auth, backup });
      state.profile = answer.profile;
      password.value = again.value = "";
      show("Your profile is made, and your key is backed up.");
    } catch (error) {
      status.replaceChildren(message(error.message, "bad"));
      idle(button);
    }
  });
  return el("section", { class: "panel" }, el("h2", { text: "Make Your Profile" }), form);
}

function manage(note) {
  const profile = state.profile;
  const display = el("input", { maxlength: "24", value: profile.display });
  const bio = el("textarea", { maxlength: "280", rows: "3" });
  bio.value = profile.bio;
  const status = el("div");
  const save = el("button", { class: "join", type: "submit", text: "Save" });
  const details = el("form", { class: "panel-body form" }, field("Name shown", display), field("About you", bio), status, save);
  details.addEventListener("submit", async event => {
    event.preventDefault();
    busy(save, "Saving…");
    try {
      const answer = await api("/v1/profile", { display: display.value.trim(), bio: bio.value.trim() });
      state.profile = answer.profile;
      status.replaceChildren(message("Saved.", "good"));
    } catch (error) { status.replaceChildren(message(error.message, "bad")); }
    idle(save);
  });

  const keyPanel = el("section", { class: "panel" }, el("h2", { text: "Your Player Key" }));
  const keyBody = el("div", { class: "panel-body form" });
  keyPanel.append(keyBody);
  if (state.playerKey) {
    const install = el("button", { class: "join", type: "button", text: "Install in Game" });
    install.addEventListener("click", () => {
      /* (the game asks before it replaces a key) */
      location.href = "halo://key/" + state.playerKey;
    });
    keyBody.append(
      message(state.linked
        ? "This is the key of the game you opened this page from."
        : "Your key backup is open in this page. If the game on this computer lost its key (a reinstall, a new computer), install it there: the game asks before it replaces its key."),
      install);
  } else {
    const password = el("input", { type: "password", autocomplete: "current-password", required: true });
    const openStatus = el("div");
    const open = el("button", { class: "join", type: "submit", text: "Open Key Backup" });
    const openForm = el("form", { class: "form" },
      message(state.keyError || "Your password opens your key backup here, to install it in a game that lost its key.", state.keyError ? "bad" : ""),
      field("Password", password), openStatus, open);
    openForm.addEventListener("submit", async event => {
      event.preventDefault();
      busy(open, "Opening…");
      try {
        const { key } = await secrets(password.value, profile.handle);
        state.playerKey = await openKey(profile.backup, key, profile.handle);
        state.keyError = null;
        password.value = "";
        show();
      } catch (error) {
        openStatus.replaceChildren(message("That password does not open your key backup.", "bad"));
        idle(open);
      }
    });
    keyBody.append(openForm);
  }
  if (state.linked && state.playerKey) {
    const password = el("input", { type: "password", autocomplete: "new-password", minlength: "10", required: true });
    const again = el("input", { type: "password", autocomplete: "new-password", minlength: "10", required: true });
    const changeStatus = el("div");
    const change = el("button", { class: "join", type: "submit", text: "Change Password" });
    const changeForm = el("form", { class: "panel-body form" },
      el("div", { class: "dim", text: "A new password re-encrypts your key backup." }),
      field("New password", password), field("New password again", again), changeStatus, change);
    changeForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (password.value !== again.value) { changeStatus.replaceChildren(message("The passwords don't match.", "bad")); return; }
      busy(change, "Protecting your key…");
      try {
        const { auth, key } = await secrets(password.value, profile.handle);
        const backup = await sealKey(state.playerKey, key, profile.handle);
        await api("/v1/profile", { display: profile.display, bio: profile.bio, auth, backup });
        password.value = again.value = "";
        changeStatus.replaceChildren(message("Password changed.", "good"));
      } catch (error) { changeStatus.replaceChildren(message(error.message, "bad")); }
      idle(change);
    });
    keyPanel.append(changeForm);
  }

  const signOut = el("button", { class: "join quiet", type: "button", text: "Sign Out" });
  signOut.addEventListener("click", async () => { await api("/v1/session/logout", {}); state = {}; location.replace("/profile"); });

  return [
    note ? message(note, "good") : null,
    el("section", { class: "panel" }, el("h2", {}, profile.display, el("span", { class: "note", text: "@" + profile.handle })),
      el("div", { class: "panel-body" },
        el("a", { href: "/players/" + state.playerId, text: "Your service record" }), " · player " + state.playerId.slice(0, 8))),
    el("section", { class: "panel" }, el("h2", { text: "Your Profile" }), details),
    keyPanel,
    el("div", { style: "margin-top:8px" }, signOut),
  ];
}

function show(note) {
  if (!state.playerId) { holder.replaceChildren(signInForm()); return; }
  if (!state.profile) { holder.replaceChildren(state.playerKey ? createForm() : signInForm("This player has no profile yet.")); return; }
  holder.replaceChildren(...manage(note).filter(Boolean));
}

async function start() {
  const link = new URLSearchParams(location.search).get("link");
  if (link) {
    /* (the code is good once: off the address bar and history at once) */
    history.replaceState(null, "", "/profile");
    try {
      const answer = await api("/v1/session/link", { code: link });
      state = { playerId: answer.player_id, profile: answer.profile, linked: true, playerKey: answer.key };
    } catch (error) {
      holder.replaceChildren(signInForm(error.message));
      return;
    }
    show();
    return;
  }
  try {
    const answer = await api("/v1/session");
    state = { playerId: answer.player_id, profile: answer.profile, linked: false, playerKey: null };
  } catch (error) { state = {}; }
  show();
}
start();
</script>
</body>
</html>
