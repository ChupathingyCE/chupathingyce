# H2 CTF: Halo 2 Capture the Flag. First to 5 captures, 15 minutes, the
# flag returns when its own side touches it, a warthog a side. Halo 2's
# multi-flag and neutral flag are not in CE's engine: this is one flag a
# side. Everyone starts with the assault rifle and the pistol.
base = "ctf"
name = "H2 CTF"
score_limit = 5
time_limit = 15

[players]
shields = true
respawn_time = 5

[items]
starting_equipment = "generic"
weapon_set = "normal"

[indicators]
objectives = "nav_points"
players_on_radar = "all"
friends_on_screen = true

[team_play]
friendly_fire = "off"
auto_balance = true

[ctf]
assault = false
single_flag_time = 0
flag_at_home_to_score = false
reset_on_capture = true
