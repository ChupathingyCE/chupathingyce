name: PR areas

# Area labels from the files a pull request changes (.github/labeler.yml).
# pull_request_target so it can label pull requests from forks; the labeler
# reads the file list through the API and runs no code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
