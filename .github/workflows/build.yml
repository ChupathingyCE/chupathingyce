            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # bgfx's sources, which the configure fetches although this job does
      # not build the renderer (the linux64, windows64 and macos jobs save
