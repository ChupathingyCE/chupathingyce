name: Build

# Debug and release builds of the native ports (Linux and Windows, 32- and
# 64-bit, Android (native 64-bit), macOS, FreeBSD), and release builds of the dedicated server (Linux
# x86, x64 and arm64, and Windows x64) and its container, for every pushed commit and pull
# request, uploaded as artifacts: whether a change builds. tools/ci_build.py does each build; see it for the options.
#
# These builds are VERSION's -dev, and never look for updates. Releases and
# nightlies are built here too, by hand or by ChupathingyCE's release
# workflows (ChupathingyCE/command), which run this workflow on main with a
# commit and its version (tools/version.py): the builds are that commit's,
# as that version, and a release's look for newer releases. Those workflows
# then sign the Android app with ChupathingyCE's key (this repository has no
# key: the debug app has the runner's debug key, the release app is
# unsigned) and publish the builds to this repository's Releases. Each run
# also uploads chupathingyce-build-info: the commit and version it built.
#
# What runs when (docs/ci.md), in tiers (the plan job):
# - A, every push to a pull request: linux, linux-tests, linux-big-endian
#   (the console gate tests are in tools/ci_tests.txt, so they run here)
#   and server (x64), plus each platform job whose own files it changes;
# - B, the merge queue (merge_group), on main with the pull request merged:
#   A plus linux64, windows, windows64, macos, android64 and freebsd64, plus
#   server-windows when the server's or Windows' files change. A pull
#   request that changes documentation alone gets A's jobs only;
# - C, every push to main or a release branch, a pull request from a
#   batch/* branch or one that changes the build's plumbing (configure.py,
#   tools/ci_build.py and the like): every job, the servers for x86 and
#   arm64, server-windows and server-container among them;
# - D, every run started with workflow_dispatch (ChupathingyCE/command's
#   nightly, test builds and releases): every job, with debug builds and
#   symbols;
# - ci-ok sums the run up in one check: green when every job the plan job
#   gave the run passed, and every other one was skipped. main requires it,
#   from the pull request's run (A) and from the merge queue's (B); a
#   release's run is checked job by job before anything ships
#   (ChupathingyCE/command).
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle,
#   the Linux builds' system roots) are cached too, and so are the Ubuntu
#   packages the Linux jobs install (CI_APT_INSTALL, in the linux job: one Ubuntu
#   mirror that stalls has cost runs their toolchain step);
# - the 32-bit Linux build is built once (linux) and tested beside the other
#   builds (linux-tests): its tree goes to runners that split the tests
#   (tools/ci_tests.txt, tools/ci_test_scripts.txt, one file a line, so that
#   pull requests adding tests do not collide) and run them with
#   pytest-xdist; the big-endian tests need no build and start at once;
# - pushes build main and release branches, never tags (the nightly, the
#   releases and the test builds start their own run with workflow_dispatch
#   before they tag anything); every other branch builds through its pull
#   request;
# - debug builds only in runs started with workflow_dispatch; pull requests
#   and pushes build release only (BUILD_DEBUG);
# - a newer commit to a pull request or a release branch cancels that
#   ref's run still going: only the newest head matters. main's runs are
#   never canceled midway (a queue of one), nor are runs started with
#   workflow_dispatch;
# - a push to main or a release branch that changes only documentation
#   does not build;
# - the caches (compiles, downloads) are saved only by a run of main's own
#   head that builds no version: each push to main, and a test build
#   started on main without a commit. Pull requests, the merge queue and
#   other branches restore main's newest and keep nothing of their own
#   (tiers A and B restore only), so they do not
#   crowd main's out of the repository's 10 GB of caches. After a push to
#   main, cache-prune deletes main's older generations of each cache (never
#   the newest) and whatever pull requests left;
# - a release's, a testing build's or a nightly's run (one started with a
#   version: what gets signed) restores no cache and saves none: it builds
#   from a clean checkout and fresh downloads, whatever a cache holds;
# - a run started with a commit builds it only when that commit is on main
#   or on a release branch (the gate job), never another commit of the
#   repository's network (a fork's pull request, say), so a run on main
#   never builds code that is not ChupathingyCE's own;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - the symbols are uploaded only by runs started with workflow_dispatch,
#   the only runs a release takes;
# - artifacts are kept for three days.
on:
  push:
    branches:
      - main
      - "release-*"
      - "release/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  # (no paths-ignore: ci-ok is the check main requires, so every pull
  # request needs a run; one that changes documentation alone gets tier A,
  # whose tests read docs/)
  pull_request:
  # (tier B: the merge queue's candidate, main with the pull request merged)
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build (a full SHA on main or a release-* branch; empty, the branch's)
        type: string
        default: ""
      version:
        description: The version (0.5.0b, 0.5.0b-nightly.42; empty, VERSION's -dev)
        type: string
        default: ""
      release:
        description: A release's build (its updater looks for newer releases; the version must be VERSION's)
        type: boolean
        default: false
      request:
        description: An ID that the caller finds this run by (in its name)
        type: string
        default: ""

# (a run started with a version is named for it, so that the release
# workflows find their run; the others keep GitHub's name)
run-name: ${{ inputs.version && format('Build {0} at {1} {2}', inputs.version, inputs.commit, inputs.request) || '' }}

# (a run started by hand is never canceled by a push, and cancels none; a
# pull request's newer push cancels its run still going, and so does a
# release branch's; main is a queue of one: the run in progress finishes,
# and only the newest push waits behind it, so a merge is never built
# halfway and dropped. A merge queue group has a ref of its own.)
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}', github.run_id) || github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  # (empty unless started with a version: VERSION's -dev, tools/version.py)
  HALO_VERSION: ${{ inputs.version }}
  HALO_RELEASE_BUILD: ${{ inputs.release && '1' || '0' }}
  # debug builds only for releases, nightlies and test builds (a run started
  # with workflow_dispatch, as ChupathingyCE/command does); pull requests
  # and pushes build release only
  BUILD_DEBUG: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  # the caches (README of this file, "Kept cheap"): restored by every run
  # that builds no version; saved only by a run on main that builds main's
  # own head (no commit given, or that commit) and no version
  CACHE_RESTORE: ${{ inputs.version == '' && 'true' || 'false' }}
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' && inputs.version == '' && (inputs.commit == '' || inputs.commit == github.sha) && 'true' || 'false' }}
  # apt.llvm.org's signing key (6084F3CF814B57C1CF12EFD515CF4D18AF4F7421)
  # as it was when pinned: a changed key stops the run
  LLVM_KEY_SHA256: 8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d

jobs:
  gate:
    # A run started with a commit (workflow_dispatch's inputs.commit) builds
    # it only when it is a full SHA in the history of main or of a release
    # branch (release-*) of this repository. GitHub checks out
    # any commit of the repository's network, a fork's unmerged pull request
    # included, and every other job waits for this one.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The commit is main's or a release branch's
        if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
        env:
          COMMIT: ${{ inputs.commit }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          case "$COMMIT" in
            *[!0123456789abcdef]*) echo "::error::commit is not a full SHA (40 hex digits, lower case)"; exit 1 ;;
          esac
          [ "${#COMMIT}" -eq 40 ] || { echo "::error::commit is not a full SHA (40 hex digits, lower case)"; exit 1; }
          # (the branches' history, commits only: no trees, no files)
          git init -q gate
          cd gate
          # (one retry: a GitHub hiccup should not fail a release's build)
          fetch() {
            git fetch -q --filter=tree:0 "$REPOSITORY" \
              '+refs/heads/main:refs/gate/main' \
              '+refs/heads/release-*:refs/gate/release-*'
          }
          fetch || { echo "fetch failed; trying again in 10 seconds"; sleep 10; fetch; }
          for branch in $(git for-each-ref --format='%(refname)' refs/gate); do
            if git merge-base --is-ancestor "$COMMIT" "$branch" 2>/dev/null; then
              echo "$COMMIT is on ${branch#refs/gate/}"
              exit 0
            fi
          done
          echo "::error::$COMMIT is not on main or a release branch: this workflow builds only ChupathingyCE's own commits"
          exit 1

  plan:
    needs: gate
    # Which platform jobs this run has: its tier (README of this file, "What
    # runs when"). The run output says, for each job that only some runs
    # have, whether this one has it; ci-ok checks against it. linux,
    # linux-tests, linux-big-endian and server (x64) always run. A pull
    # request's files are read from GitHub, a merge queue group's from the
    # comparison of its base and head.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      run: ${{ steps.plan.outputs.run }}
      server_archs: ${{ steps.plan.outputs.server_archs }}
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          # (tier B's platforms; tier C adds the servers' other jobs)
          b_jobs=(linux64 freebsd64 windows windows64 macos android64)
          c_jobs=(server_windows server_container)
          # finish <tier> <why> <server archs> <job>...: the jobs given run
          finish() {
            local tier=$1 why=$2 archs=$3 run="" job
            shift 3
            echo "tier $tier: $why"
            for job in "${b_jobs[@]}" "${c_jobs[@]}"; do
              case " $* " in *" $job "*) run="$run,\"$job\":true" ;; *) run="$run,\"$job\":false" ;; esac
            done
            out tier "$tier"
            out run "{${run#,}}"
            out server_archs "$archs"
            exit 0
          }
          all='["x86","x64","arm64"]'
          case "$EVENT" in
            pull_request|merge_group) ;;
            workflow_dispatch) finish d "started by hand" "$all" "${b_jobs[@]}" "${c_jobs[@]}" ;;
            *) finish c "$EVENT" "$all" "${b_jobs[@]}" "${c_jobs[@]}" ;;
          esac
          if [ "$EVENT" = pull_request ]; then
            tier=a
            case "$HEAD_REF" in batch/*) finish c "a batch ($HEAD_REF)" "$all" "${b_jobs[@]}" "${c_jobs[@]}" ;; esac
            # (GitHub not answering is no reason to build less)
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)') \
              || finish b "the pull request's files could not be read" '["x64"]' "${b_jobs[@]}"
          else
            tier=b
            # (a comparison lists 300 files at most: more counts as code)
            files=$(gh api "repos/$REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
              --jq 'if (.files | length) >= 300 then "(many files)" else (.files[] | .filename, (.previous_filename // empty)) end') \
              || finish b "the merge group's files could not be read" '["x64"]' "${b_jobs[@]}"
          fi
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # (what changes how every platform builds)
          [ "$(has '^(configure\.py|VERSION|tools/(ci_build|version|download|ffmpeg_build|bgfx_build|third_party_notices)\.py)$')" = true ] \
            && finish c "the build's plumbing changed" "$all" "${b_jobs[@]}" "${c_jobs[@]}"
          # (documentation alone: tier A's jobs, whose tests read docs/)
          if [ -n "$files" ] && ! grep -qvE '(\.md$|^docs/)' <<< "$files"; then
            finish "$tier" "documentation only" '["x64"]'
          fi
          windows=$(has '^(port/windows/|server/windows/|tools/windows_build\.py$)')
          server=$(has '^(server/|tools/server_build\.py$)')
          jobs=()
          [ "$tier" = b ] && jobs=("${b_jobs[@]}")
          [ "$windows" = true ] && jobs+=(windows windows64 server_windows)
          # (the queue also builds the Windows server for a change to the server)
          [ "$tier" = b ] && [ "$server" = true ] && jobs+=(server_windows)
          [ "$(has '^(port/android/|tools/android)')" = true ] && jobs+=(android64)
          [ "$(has '^(port/macos/|port/ios/|tools/macos_build\.py$)')" = true ] && jobs+=(macos)
          [ "$(has '^(port/unix/|tools/unix64_build\.py$)')" = true ] && jobs+=(freebsd64)
          [ "$(has '^(tools/linux64_build\.py$|tools/linux_sysroot\.py$|tools/bgfx-patches/|port/linux/src/(d3d8_bgfx|bgfx_))')" = true ] \
            && jobs+=(linux64)
          finish "$tier" "$([ "$tier" = a ] && echo "a pull request" || echo "the merge queue")" '["x64"]' ${jobs[@]+"${jobs[@]}"}

      # (the workflow's own commit: the test lists, the buckets and the
      # selector, and for a pull request the tree its files are looked up in)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Which tests linux-tests runs, and on how many runners
      # (tools/ci_select_tests.py, docs/ci.md): a pull request's own files
      # choose the area tests beside the core ones; every other run, the
      # merge queue's among them, runs them all. A pull request whose files
      # cannot be read, or that has too many for GitHub to list, runs them all.
      - name: Tests
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=()
          if [ "$EVENT" = pull_request ] && [[ "$HEAD_REF" != batch/* ]]; then
            list="$RUNNER_TEMP/changed.json"
            if gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files?per_page=100" \
                --jq '.[] | {filename, previous_filename, patch}' > "$list" \
              && [ "$(wc -l < "$list")" -lt 3000 ]; then
              changed=(--changed "$list")
            else
              echo "::notice::the pull request's files could not be listed: every test runs"
            fi
          fi
          python3 tools/ci_select_tests.py --event "$EVENT" ${changed[@]+"${changed[@]}"} --explain > "$RUNNER_TEMP/tests.json"
          jq -r '"tests: \(.why)", (.parts[] | "\(.name): \(.pytest) \(.harness) \(.scripts)\(if .update_install then " tools/test_update_install.py" else "" end)")' "$RUNNER_TEMP/tests.json"
          echo "tests=$(jq -c . "$RUNNER_TEMP/tests.json")" >> "$GITHUB_OUTPUT"

  info:
    needs: gate
    # what this run builds: the commit (inputs.commit, else the run's) and
    # the version, which the release workflows check before they publish
    # its builds (only theirs: runs started with workflow_dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Build info
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUEST: ${{ inputs.request }}
        run: |
          mkdir -p dist/chupathingyce-build-info
          python3 - > dist/chupathingyce-build-info/build-info.json <<'EOF'
          import json, os, subprocess
          from tools.version import release_build, version
          print(json.dumps({
              "commit": subprocess.run(["git", "rev-parse", "HEAD"], check=True, capture_output=True,
                                       text=True).stdout.strip(),
              "version": version(),
              "release": release_build(),
              "event": os.environ["EVENT"],
              "ref": os.environ["REF"],
              "request": os.environ["REQUEST"],
          }, indent=2))
          EOF
          cat dist/chupathingyce-build-info/build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-build-info
          path: dist/chupathingyce-build-info
          retention-days: 3

  linux:
    needs: gate
    # Ubuntu 24.04 with clang 22 from apt.llvm.org (the profile-guided
    # optimisation in pgo/ needs that major version; its bin directory goes
    # first on PATH, so that clang, ld.lld and llvm-profdata are clang 22's
    # rather than the runner's), and CMake, pkg-config and wayland-scanner
    # for the SDL 3 that the portable build brings. The build links against
    # Debian 11's 32-bit glibc 2.31 (tools/linux_sysroot.py), not Ubuntu's,
    # so that it starts on older distributions; Ubuntu's 32-bit glibc
    # (gcc-multilib) is for the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLVM_MAJOR: 22
      APT_PACKAGES: >-
        clang-22 lld-22 llvm-22 libclang-rt-22-dev gcc gcc-multilib libc6-dev-i386 cmake pkg-config
        libwayland-bin ninja-build ccache python3-pytest zstd
    steps:
      # The Linux jobs' Ubuntu packages: CI_APT_INSTALL, written once here
      # (&ci-apt-install) and named by the others' steps (*ci-apt-install),
      # so that only the steps that use it print it, and a release branch's
      # commit built with main's workflow has it. APT_PACKAGES is what to
      # install; APT_CACHE the folder the job's actions/cache steps keep:
      # apt's package lists and the .debs of the last install on this runner
      # image (the key has the image's version, the packages and this
      # script); APT_CACHE_HIT is true when the cache restored is that key's
      # own; LLVM_MAJOR, when set, adds apt.llvm.org's clang of that major
      # version (its key checked against LLVM_KEY_SHA256).
      # - with the key's own cache: the .debs are installed as they are, with
      #   the lists they came with, and nothing is downloaded;
      # - otherwise (no cache, another image's, or one that lacks a package):
      #   apt's lists are fetched fresh and the .debs downloaded first (those
      #   the cache has already are kept, and the ones no longer listed
      #   dropped), each try cut off by timeout; a try that fails starts the
      #   next with another Ubuntu mirror first, and the .debs a try finished
      #   stay for the next, so a slow mirror's progress is kept. Only then is
      #   anything installed, offline.
      - name: The packages' cache key
        id: apt
        env:
          CI_APT_INSTALL: &ci-apt-install |
            set -euo pipefail
            cache=${APT_CACHE:?}
            read -r -d '' -a packages <<< "${APT_PACKAGES:?}" || true
            mkdir -p "$cache/debs/partial" "$cache/lists/partial"
            sudo chown _apt "$cache/debs/partial" "$cache/lists/partial" 2> /dev/null || true
            printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
              'Acquire::Languages "none";' "Dir::Cache::archives \"$cache/debs/\";" "Dir::State::lists \"$cache/lists/\";" \
              | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
            if [ -n "${LLVM_MAJOR:-}" ]; then
              [ -s "$cache/apt.llvm.org.asc" ] \
                || curl -fsSL --retry 3 --max-time 60 -o "$cache/apt.llvm.org.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
              echo "${LLVM_KEY_SHA256:?}  $cache/apt.llvm.org.asc" | sha256sum -c -
              sudo install -d -m 0755 /etc/apt/keyrings
              sudo install -m 0644 "$cache/apt.llvm.org.asc" /etc/apt/keyrings/apt.llvm.org.asc
              echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
                | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
            fi
            apt_install() { sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "$@" "${packages[@]}"; }
            keep() { sudo rm -rf "$cache/debs/partial" "$cache/lists/partial" "$cache/debs/lock" "$cache/lists/lock"; sudo chown -R "$(id -u):$(id -g)" "$cache"; }
            if [ "${APT_CACHE_HIT:-}" = true ] && compgen -G "$cache/lists/*Packages*" > /dev/null; then
              if apt_install --no-download; then echo "apt: installed from the cache"; keep; exit 0; fi
              echo "::notice::apt: the cache lacks some of the packages; downloading them"
            fi
            # (the runner's mirror list, then two more; each try puts the next first)
            mirrors=${APT_MIRRORS:-/etc/apt/apt-mirrors.txt}
            list=()
            if [ -f "$mirrors" ]; then
              while read -r uri _; do case "$uri" in "" | "#"*) ;; *) list+=("$uri") ;; esac; done < "$mirrors"
              for uri in http://archive.ubuntu.com/ubuntu/ http://azure.archive.ubuntu.com/ubuntu/; do
                case " ${list[*]:-} " in *" $uri "*) ;; *) list+=("$uri") ;; esac
              done
            fi
            updated=0 downloaded=0
            for try in 1 2 3 4; do
              if [ "$try" -gt 1 ] && [ "${#list[@]}" -gt 1 ]; then
                for ((i = 0; i < ${#list[@]}; i++)); do
                  printf '%s\tpriority:%d\n' "${list[(i + try - 1) % ${#list[@]}]}" $((i + 1))
                done | sudo tee "$mirrors" > /dev/null
                echo "apt: try $try, from ${list[(try - 1) % ${#list[@]}]} first"
              fi
              if [ "$updated" = 0 ]; then sudo timeout 120 apt-get update -q && updated=1; fi
              if [ "$updated" = 1 ] && sudo timeout 90 apt-get install -y -q --no-install-recommends --download-only "${packages[@]}"; then
                downloaded=1; break
              fi
              echo "apt: try $try of 4 failed" >&2
              sleep 5
            done
            [ "$downloaded" = 1 ] || { echo "::error::apt: could not download the packages"; exit 1; }
            sudo apt-get autoclean -q
            apt_install --no-download
            keep
        run: |
          echo "key=apt-linux32-$(printf '%s\n' "$ImageOS" "$ImageVersion" "${LLVM_MAJOR:-}" "$APT_PACKAGES" "$CI_APT_INSTALL" \
            | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apt-cache
        if: env.CACHE_RESTORE == 'true'
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          # (another image's: its .debs that still match are kept)
          restore-keys: apt-linux32-

      - name: Install the toolchain
        timeout-minutes: 20
        env:
          APT_CACHE: ${{ runner.temp }}/apt
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          CI_APT_INSTALL: *ci-apt-install
        run: |
          bash -c "$CI_APT_INSTALL"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      # bgfx's sources, which the configure fetches although this job does
      # not build the renderer (the linux64, windows64 and macos jobs save
      # them)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py linux debug

      - name: Release
        run: python3 tools/ci_build.py linux release

      # (no executable or library that needs a newer glibc than the system
      # root's: tools/linux_glibc_check.py)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py $([ "$BUILD_DEBUG" = true ] && echo dist/chupathingyce-linux-debug) dist/chupathingyce-linux-release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-linux-debug
          path: dist/chupathingyce-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux-release
          path: dist/chupathingyce-linux-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-linux-release
          path: dist/chupathingyce-linux-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      # (the configured and built tree, for linux-tests: build.ninja, ninja's
      # log and dependencies, and build/; kept a day, not a download)
      - name: Pack the build for the tests
        run: |
          tar -cf "$RUNNER_TEMP/linux-build-tree.tar.zst" -I 'zstd -T0 -3' \
            build.ninja $(ls -d .ninja_log .ninja_deps 2>/dev/null) build
          ls -lh "$RUNNER_TEMP/linux-build-tree.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-build-tree
          path: ${{ runner.temp }}/linux-build-tree.tar.zst
          compression-level: 0
          retention-days: 1

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.apt-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}

  linux-tests:
    needs: [gate, plan, linux]
    # The tests, against the linux job's build (its tree: build.ninja, ninja's
    # log, build/), in parallel, as the plan job chose and split them
    # (tools/ci_select_tests.py): the pytest files of tools/ci_tests.txt in
    # shards, each on its own runner with pytest-xdist's workers (one a
    # processor), one to three by their weight; and one runner, "other", for
    # the engine's harness (tools/harness), the tests written as scripts
    # (tools/ci_test_scripts.txt) and the self-updater from end to end. The
    # lists are read from this workflow's own commit, so that a release
    # branch's commit built with main's workflow runs the tests it has (the
    # others are left out with a notice). Same toolchain as the linux job.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.tests).parts }}
    name: linux-tests (${{ matrix.part.name }})
    env:
      LLVM_MAJOR: 22
      APT_PACKAGES: >-
        clang-22 lld-22 llvm-22 libclang-rt-22-dev gcc gcc-multilib libc6-dev-i386 cmake pkg-config
        libwayland-bin ninja-build ccache python3-pytest python3-pytest-xdist python3-numpy python3-pil zstd
    steps:
      # (the Ubuntu packages: CI_APT_INSTALL, in the linux job; the key
      # changes with the runner image, the packages and the script)
      - name: The packages' cache key
        id: apt
        env:
          CI_APT_INSTALL: *ci-apt-install
        run: |
          echo "key=apt-linux-tests-$(printf '%s\n' "$ImageOS" "$ImageVersion" "${LLVM_MAJOR:-}" "$APT_PACKAGES" "$CI_APT_INSTALL" \
            | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apt-cache
        if: env.CACHE_RESTORE == 'true'
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          # (another image's: its .debs that still match are kept)
          restore-keys: apt-linux-tests-

      - name: Install the toolchain
        timeout-minutes: 20
        env:
          APT_CACHE: ${{ runner.temp }}/apt
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          CI_APT_INSTALL: *ci-apt-install
        run: |
          bash -c "$CI_APT_INSTALL"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/save@v4
        if: ${{ env.CACHE_SAVE == 'true' && steps.apt-cache.outputs.cache-hit != 'true' && matrix.part.name == 'other' }}
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (JDK 17 for the Android touch layout's checks, tools/test_touch_layout.py,
      # one of the script tests: not left to the runner image)
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.part.name == 'other'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: ci-linux-build-tree
          path: ${{ runner.temp }}

      # (the tree as the linux job left it; the checkout's files dated before
      # it, so that ninja finds the build up to date instead of compiling it
      # again: what ninja's log recorded is newer)
      - name: Unpack the build
        run: |
          tar -I zstd -xf "$RUNNER_TEMP/linux-build-tree.tar.zst"
          rm "$RUNNER_TEMP/linux-build-tree.tar.zst"
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00 UTC'
          # (and the checkout's HEAD log, which build.ninja is configured from)
          touch -d '2000-01-01 00:00:00 UTC' "$(git rev-parse --git-path logs/HEAD)"
          # (and build.ninja newer than the checkout's folders, source/units
          # among them: the tar keeps the files' times but not the folders',
          # which are the checkout's, so ninja would configure again and the
          # "would rebuild" check below warned on every part; #1125)
          touch build.ninja
          left=$(ninja -n linux | grep -c '^\[' || true)
          if [ "$left" -gt 0 ]; then
            echo "::warning::ninja would rebuild $left steps of the unpacked build"
            ninja -n -d explain linux 2>&1 | head -n 20
          fi

      # (HALO_SANITIZERS_REQUIRED: a test without its sanitizers' runtime or
      # libFuzzer fails here, where clang's runtimes are installed, instead of
      # building unsanitized or skipping; tools/fuzz_support.py)
      - name: Test
        env:
          HALO_SANITIZERS_REQUIRED: "1"
          PYTEST_FILES: ${{ matrix.part.pytest }}
          HARNESS_FILES: ${{ matrix.part.harness }}
          SCRIPT_FILES: ${{ matrix.part.scripts }}
          UPDATE_INSTALL: ${{ matrix.part.update_install }}
          HALO_UPDATE_TEST_SDL: build/linux
          UPDATE_INSTALL_REQUIRED: "1"
        run: |
          # (the files this part was given that are in this commit: a release
          # branch's commit, built with main's workflow, may not have every
          # test main has yet)
          present() {
            for test in "$@"; do
              if [ -f "$test" ]; then echo "$test"; else echo "::notice::$test: not in this commit" >&2; fi
            done
          }
          tests=$(present $PYTEST_FILES)
          if [ -n "$tests" ]; then
            python3 -m pytest -q -n auto --durations=15 $tests
          fi
          # (the self-updater from end to end, against the 32-bit SDL 3 the
          # linux job built in build/linux: tools/test_update_install.py;
          # UPDATE_INSTALL_REQUIRED, so that a missing piece fails, never skips)
          if [ "$UPDATE_INSTALL" = true ]; then
            tests=$(present tools/test_update_install.py)
            if [ -n "$tests" ]; then python3 -m pytest -q -rs $tests; fi
          fi
          # (the asset-free tests of the engine's own functions, tools/harness;
          # the ones not brought up to date with the code they test are in the
          # local bucket, tools/ci_test_buckets.txt, and never given)
          tests=$(present $HARNESS_FILES)
          if [ -n "$tests" ] && [ -f tools/harness/__init__.py ]; then
            python3 -m pytest -q -n auto $tests
          fi
          for test in $(present $SCRIPT_FILES); do
            echo "== $test"
            python3 "$test"
          done

  linux-big-endian:
    needs: gate
    # Delta's wire on a big-endian machine, as the Xbox 360 and Wii U are
    # (tools/test_delta_big_endian.py, under QEMU), and structure culling's
    # reads of the map's vertices there. Needs no build: it runs beside them.
    # (32-bit headers and libraries without gcc-multilib, which the s390x
    # cross compiler conflicts with: the shader key test builds with -m32)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APT_PACKAGES: >-
        gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user libc6-dev-i386 lib32gcc-13-dev python3-pytest
    steps:
      # (the Ubuntu packages: CI_APT_INSTALL, in the linux job; the key
      # changes with the runner image, the packages and the script)
      - name: The packages' cache key
        id: apt
        env:
          CI_APT_INSTALL: *ci-apt-install
        run: |
          echo "key=apt-big-endian-$(printf '%s\n' "$ImageOS" "$ImageVersion" "${LLVM_MAJOR:-}" "$APT_PACKAGES" "$CI_APT_INSTALL" \
            | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apt-cache
        if: env.CACHE_RESTORE == 'true'
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          # (another image's: its .debs that still match are kept)
          restore-keys: apt-big-endian-

      - name: Install the toolchain
        timeout-minutes: 20
        env:
          APT_CACHE: ${{ runner.temp }}/apt
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          CI_APT_INSTALL: *ci-apt-install
        run: |
          bash -c "$CI_APT_INSTALL"

      - uses: actions/cache/save@v4
        if: ${{ env.CACHE_SAVE == 'true' && steps.apt-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Delta on big-endian
        timeout-minutes: 10
        run: |
          DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/test_delta_big_endian.py tools/test_vertex_byte_order.py -rs
          # (the shader key lists read the same on a big-endian machine)
          if [ -f tools/test_shader_keys.py ]; then
            DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/test_shader_keys.py -rs
          fi
          # (structure culling from the Xbox's vertex bytes, #925)
          if [ -f tools/harness/tests/test_structure_culling_byte_order.py ]; then
            DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/harness/tests/test_structure_culling_byte_order.py -rs
          fi

  linux64:
    needs: [gate, plan]
    if: fromJSON(needs.plan.outputs.run).linux64
    # The native 64-bit Linux build (ninja linux64), on Ubuntu with clang 22
    # as the 32-bit one, and portable as it is: against Debian 11's amd64
    # glibc 2.31, with the SDL 3 it brings (tools/linux_sysroot.py --arch
    # amd64).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLVM_MAJOR: 22
      APT_PACKAGES: >-
        clang-22 lld-22 llvm-22 gcc cmake pkg-config libwayland-bin ninja-build ccache zstd spirv-tools
    steps:
      # (the Ubuntu packages: CI_APT_INSTALL, in the linux job; the key
      # changes with the runner image, the packages and the script)
      - name: The packages' cache key
        id: apt
        env:
          CI_APT_INSTALL: *ci-apt-install
        run: |
          echo "key=apt-linux64-$(printf '%s\n' "$ImageOS" "$ImageVersion" "${LLVM_MAJOR:-}" "$APT_PACKAGES" "$CI_APT_INSTALL" \
            | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apt-cache
        if: env.CACHE_RESTORE == 'true'
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          # (another image's: its .debs that still match are kept)
          restore-keys: apt-linux64-

      - name: Install the toolchain
        timeout-minutes: 20
        env:
          APT_CACHE: ${{ runner.temp }}/apt
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          CI_APT_INSTALL: *ci-apt-install
        run: |
          bash -c "$CI_APT_INSTALL"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux64-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/linux64/third_party
          key: linux64-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      # bgfx's, bx's and bimg's sources, which the build fetches for the bgfx
      # renderer (tools/bgfx_build.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}
          # (a changed pin or patch starts from the last sources:
          # tools/bgfx_build.py fetches and patches what differs)
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py linux64 debug

      - name: Release
        run: python3 tools/ci_build.py linux64 release

      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py $([ "$BUILD_DEBUG" = true ] && echo dist/chupathingyce-linux64-debug) dist/chupathingyce-linux64-release

      # every shader the bgfx renderer can be asked for, compiled for Vulkan
      # and its SPIR-V checked by spirv-val (tools/bgfx_shader_check.py)
      - name: bgfx shaders
        run: python3 tools/bgfx_shader_check.py --binary dist/chupathingyce-linux64-release/chupathingy --out build/bgfx-shaders

      # nothing of a player's (config.toml, logs, saves) in what an update
      # puts over their install (#2029): tools/package_check.py
      - name: Player files
        run: python3 tools/package_check.py $([ "$BUILD_DEBUG" = true ] && echo dist/chupathingyce-linux64-debug) dist/chupathingyce-linux64-release

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bgfx-shaders-linux64
          path: build/bgfx-shaders
          if-no-files-found: ignore
          retention-days: 3

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-linux64-debug
          path: dist/chupathingyce-linux64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux64-release
          path: dist/chupathingyce-linux64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-linux64-release
          path: dist/chupathingyce-linux64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/linux64/third_party
          key: linux64-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.apt-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}

  freebsd64:
    needs: [gate, plan]
    if: fromJSON(needs.plan.outputs.run).freebsd64
    # The native 64-bit FreeBSD build (ninja freebsd64, port/unix: Renkoto's
    # port), built on FreeBSD 15.1 itself, in a virtual machine on Ubuntu
    # (vmactions/freebsd-vm, pinned to a commit: QEMU with the runner's KVM;
    # the checkout synced in with rsync and dist/ back out). Cross-compiling
    # from Linux would need a FreeBSD system root with the ports' SDL3 and a
    # build that names its host apart from the machine it runs on; the
    # virtual machine builds as a FreeBSD player does, with the base
    # system's clang and the packages, for a few minutes of start-up. Its
    # SDL3 is the system's package, not brought along.
    #
    # A release's or a nightly's run (started by hand) does not fail when
    # this job does: the other platforms are still published, without
    # FreeBSD's (ChupathingyCE/command takes it when it is there). A commit
    # from before the port has none.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      FREEBSD_RELEASE: "15.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Has it
        id: has
        run: |
          if [ -f tools/unix64_build.py ]; then
            echo "freebsd64=true" >> "$GITHUB_OUTPUT"
            # (git in the virtual machine may not read the synced checkout)
            echo "HALO_COMMIT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          else
            echo "::notice::no FreeBSD build at this commit (ninja freebsd64): skipped"
          fi

      # (restored and saved as the other jobs' are)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true' && steps.has.outputs.freebsd64 == 'true'
        with:
          path: .ccache
          key: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-${{ github.sha }}
          restore-keys: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-

      # the FFmpeg source tarball (tools/download.py)
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true' && steps.has.outputs.freebsd64 == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - name: Debug and release, on FreeBSD
        if: steps.has.outputs.freebsd64 == 'true'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          usesh: true
          sync: rsync
          envs: "BUILD_DEBUG HALO_VERSION HALO_RELEASE_BUILD HALO_COMMIT CI_COMPILER_LAUNCHER CCACHE_DIR CCACHE_BASEDIR CCACHE_MAXSIZE"
          prepare: |
            pkg install -y python3 ninja pkgconf sdl3 gmake llvm ccache
          run: |
            set -e
            freebsd-version
            cc --version | head -n 1
            if [ "$BUILD_DEBUG" = true ]; then python3 tools/ci_build.py freebsd64 debug; fi
            python3 tools/ci_build.py freebsd64 release
            ccache --show-stats
            # (only dist/, the compile cache and the downloads come back)
            rm -rf build/freebsd64

      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.freebsd64 == 'true' && env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-freebsd64-debug
          path: dist/chupathingyce-freebsd64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.freebsd64 == 'true'
        with:
          name: chupathingyce-freebsd64-release
          path: dist/chupathingyce-freebsd64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && steps.has.outputs.freebsd64 == 'true'
        with:
          name: symbols-freebsd64-release
          path: dist/chupathingyce-freebsd64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' && steps.has.outputs.freebsd64 == 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && steps.has.outputs.freebsd64 == 'true' && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-${{ github.sha }}

  server:
    needs: [gate, plan]
    # The dedicated server (tools/server_build.py): one static program for
    # each architecture, built against musl in Alpine Linux's container of
    # that architecture (tools/ci_build.py --alpine; x86 on the x86-64
    # runner, arm64 on GitHub's arm64 one), then started on the runner's
    # Ubuntu, which it shares nothing with: it prints its version, refuses
    # to start without a playlist, and stops with a clear error without maps.
    # (x64 on every run, so that every pull request checks -DHALO_SERVER;
    # x86 and arm64 only on main, batches, plumbing changes and runs started
    # by hand: the plan job)
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.server_archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-server-${{ matrix.arch }}-

      # SDL's headers, which configure.py fetches
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/server/third_party
          key: server-third-party-${{ matrix.arch }}-${{ hashFiles('tools/server_build.py') }}

      - name: Release
        run: python3 tools/ci_build.py server-${{ matrix.arch }} release --alpine

      # (static, against musl: no glibc version, and no library, to need)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py --static dist/chupathingyce-server-linux-${{ matrix.arch }}

      - name: Start it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          server="$smoke/chupathingyce-server"
          mkdir -p "$smoke/data/playlists"
          cp dist/chupathingyce-server-linux-${{ matrix.arch }}/chupathingyce-server "$server"
          file "$server"
          # (a release's download is without its debug information)
          if file "$server" | grep -q "with debug_info"; then echo "not stripped"; exit 1; fi
          "$server" --version
          # no playlist: how to start one, and status 2
          status=0; "$server" || status=$?
          test "$status" = 2
          # a playlist, but no maps: a clear error, and status 1
          echo "bloodgulch slayer" > "$smoke/data/playlists/test.txt"
          status=0
          HALO_DATA_ROOT="$smoke/data" HALO_SAVE_ROOT="$smoke/saves" HALO_DEDICATED=playlists/test.txt \
            HALO_NET_ONLINE=false HALO_NET_LIST_GAMES=false \
            timeout 60 "$server" 2> "$smoke/error.txt" || status=$?
          cat "$smoke/error.txt"
          test "$status" = 1
          grep -q "no maps" "$smoke/error.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-server-linux-${{ matrix.arch }}
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-server-linux-${{ matrix.arch }}-release
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/server/third_party
          key: server-third-party-${{ matrix.arch }}-${{ hashFiles('tools/server_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}

  server-container:
    # The server's container (server/deploy/Dockerfile) for the three
    # architectures at once, from the server job's programs, as buildx makes
    # it (nothing runs while it builds); then each started once, as above
    # (arm64 emulated). Not pushed anywhere: server-image.yml pushes each
    # release's and the nightly's, from their published servers.
    # (full runs only: it repackages the server job's three programs)
    needs: [gate, plan, server]
    if: fromJSON(needs.plan.outputs.run).server_container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: chupathingyce-server-linux-*
          path: artifacts

      # (no cache of QEMU's image: it kept 30 MB for every pull request, which
      # crowded main's compile caches out of the repository's 10 GB)
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          context="$RUNNER_TEMP/context"
          mkdir -p "$context"
          cp server/deploy/Dockerfile "$context/"
          for pair in x86:386 x64:amd64 arm64:arm64; do
            arch=${pair%%:*}; platform=${pair#*:}
            mkdir -p "$context/bin/$platform"
            cp "artifacts/chupathingyce-server-linux-$arch/chupathingyce-server" \
              "artifacts/chupathingyce-server-linux-$arch/LICENSE.txt" \
              "artifacts/chupathingyce-server-linux-$arch/THIRD-PARTY-NOTICES.txt" "$context/bin/$platform/"
            chmod +x "$context/bin/$platform/chupathingyce-server"
          done
          docker buildx build --platform linux/386,linux/amd64,linux/arm64 \
            --output type=oci,dest="$RUNNER_TEMP/chupathingyce-server.oci.tar" "$context"
          ls -l "$RUNNER_TEMP/chupathingyce-server.oci.tar"

      - name: Start each
        run: |
          for platform in 386 amd64 arm64; do
            docker buildx build --platform linux/$platform --load -t chupathingyce-server:$platform "$RUNNER_TEMP/context"
            docker run --rm --platform linux/$platform --cap-drop ALL --security-opt no-new-privileges \
              chupathingyce-server:$platform --version
            # (its license and notices beside it)
            docker run --rm --platform linux/$platform --entrypoint /bin/sh chupathingyce-server:$platform \
              -c 'test -s /opt/chupathingyce/LICENSE.txt && test -s /opt/chupathingyce/THIRD-PARTY-NOTICES.txt'
            # (not root)
            test "$(docker image inspect -f '{{.Config.User}}' chupathingyce-server:$platform)" = 1000:1000
          done
          docker image ls chupathingyce-server

  server-windows:
    needs: [gate, plan]
    if: fromJSON(needs.plan.outputs.run).server_windows
    # The dedicated server for 64-bit Windows (ninja server-windows64;
    # tools/windows_build.py), a console program with no SDL, packaged as
    # chupathingyce-server-windows-x64 with start-server.bat and its README
    # (server/windows); then started as the server job starts the Linux
    # ones, and installed, started and taken out once as a Windows service
    # (the runner's user is an administrator). Release only, as the Linux
    # servers.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # clang 22, as the Linux jobs have it from apt.llvm.org: the image's
          # LLVM (20) is older than the STL of Visual Studio 18 (MSVC 14.52)
          # accepts (error STL1000), and the committed profiles need 22
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -OutFile llvm.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          if ((Get-FileHash llvm.exe -Algorithm SHA256).Hash -ne "16E5709785FEF73C854646241C4A92C5CD574318D1B33C63330DD7721903E55C") { throw "llvm.exe: unexpected SHA-256" }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=$env:RUNNER_TEMP\llvm"
          Remove-Item llvm.exe
          & "$env:RUNNER_TEMP\llvm\bin\clang.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "clang 22 did not install" }
          "$env:RUNNER_TEMP\llvm\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-server-windows64-${{ github.sha }}
          restore-keys: ccache-server-windows64-

      # SDL's development package, which configure.py fetches (its headers
      # only, for the server)
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      # bgfx's sources, which the configure fetches although this job does
      # not build the renderer (the linux64, windows64 and macos jobs save
      # them)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Release
        run: python tools/ci_build.py server-windows64 release

      - name: Compile cache
        run: ccache --show-stats

      - name: Start it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          server="$smoke/chupathingyce-server.exe"
          mkdir -p "$smoke/data/playlists"
          cp dist/chupathingyce-server-windows-x64/chupathingyce-server.exe "$server"
          ls dist/chupathingyce-server-windows-x64
          test -f dist/chupathingyce-server-windows-x64/start-server.bat
          test -f dist/chupathingyce-server-windows-x64/README.txt
          # (no SDL, nothing beside it to load)
          if objdump -p "$server" 2>/dev/null | grep -i "DLL Name" | grep -i sdl; then echo "links SDL"; exit 1; fi
          "$server" --version
          # no playlist: how to start one, and status 2
          status=0; "$server" || status=$?
          test "$status" = 2
          # --service, not started by the service manager: status 2
          status=0; "$server" --service 2> "$smoke/service.txt" || status=$?
          cat "$smoke/service.txt"
          test "$status" = 2
          # a playlist, but no maps: a clear error, and status 1
          echo "bloodgulch slayer" > "$smoke/data/playlists/test.txt"
          status=0
          HALO_DATA_ROOT="$(cygpath -w "$smoke/data")" HALO_SAVE_ROOT="$(cygpath -w "$smoke/saves")" \
            HALO_DEDICATED=playlists/test.txt HALO_NET_ONLINE=false HALO_NET_LIST_GAMES=false \
            timeout 60 "$server" 2> "$smoke/error.txt" < /dev/null || status=$?
          cat "$smoke/error.txt"
          test "$status" = 1
          grep -q "no maps" "$smoke/error.txt"

      - name: As a service
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "service-data"
          New-Item -ItemType Directory -Force (Join-Path $data "playlists") | Out-Null
          Copy-Item dist/chupathingyce-server-windows-x64/chupathingyce-server.exe $data
          Set-Content (Join-Path $data "playlists/test.txt") "bloodgulch slayer"
          Set-Location $data
          $env:HALO_DEDICATED = "playlists\test.txt"
          $env:HALO_NET_ONLINE = "false"
          $env:HALO_NET_LIST_GAMES = "false"
          & .\chupathingyce-server.exe --install-service ChupathingySmoke
          if ($LASTEXITCODE -ne 0) { throw "--install-service: $LASTEXITCODE" }
          sc.exe qc ChupathingySmoke
          if (-not ((sc.exe qc ChupathingySmoke) -match "NT SERVICE\\ChupathingySmoke")) { throw "not its own account" }
          # (no maps: it starts, says so in its output file, and stops)
          $output = Join-Path $data "logs/server-output.txt"
          for ($i = 0; $i -lt 30 -and -not ((Test-Path $output) -and (Select-String -Quiet "no maps" $output)); $i++) { Start-Sleep 1 }
          Get-Content $output -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet "no maps" $output)) { throw "the service did not run the server" }
          & .\chupathingyce-server.exe --uninstall-service ChupathingySmoke
          if ($LASTEXITCODE -ne 0) { throw "--uninstall-service: $LASTEXITCODE" }
          sc.exe query ChupathingySmoke
          if ($LASTEXITCODE -eq 0) { throw "the service is still there" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-server-windows-x64
          path: dist/chupathingyce-server-windows-x64
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-server-windows-x64-release
          path: dist/chupathingyce-server-windows-x64-release-symbols
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-server-windows64-${{ github.sha }}

  android64:
    needs: [gate, plan]
    if: fromJSON(needs.plan.outputs.run).android64
    # The native 64-bit Android app (ninja android64; tools/android64_build.py):
    # the Android download (the 32-bit-address app is no longer built here;
    # its code stays in port/android).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-android64-${{ github.sha }}
          restore-keys: ccache-android64-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # musl and SDL, which configure.py fetches
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # bgfx's sources, which the configure fetches although this job does
      # not build the renderer (the linux64, windows64 and macos jobs save
      # them)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}
          restore-keys: bgfx-source-${{ runner.os }}-

      # (no keystore.properties here, as in the android job: the debug app
      # has the runner's debug key, the release app is unsigned)
      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py android64 debug

      - name: Release
        run: python3 tools/ci_build.py android64 release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-android64-debug-testkey
          path: dist/chupathingyce-android64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-android64-release-unsigned
          path: dist/chupathingyce-android64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-android64-release
          path: dist/chupathingyce-android64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-android64-${{ github.sha }}

  windows:
