        with:
          path: build/macos/third_party
          key: macos-sdl3-${{ hashFiles('tools/android_build.py', 'tools/macos_build.py', 'tools/ffmpeg_build.py') }}

      # bgfx's, bx's and bimg's sources, which the build fetches for the bgfx
      # renderer (tools/bgfx_build.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}
          # (a changed pin or patch starts from the last sources:
          # tools/bgfx_build.py fetches and patches what differs)
          restore-keys: bgfx-source-${{ runner.os }}-

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py macos debug

      - name: Release
        run: python3 tools/ci_build.py macos release

      - name: Package
        run: |
          if [ "$BUILD_DEBUG" = true ]; then tar -C dist -cf chupathingyce-macos-debug.tar chupathingyce-macos-debug; fi
          tar -C dist -cf chupathingyce-macos-release.tar chupathingyce-macos-release

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-macos-debug
          path: chupathingyce-macos-debug.tar
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-macos-release
          path: chupathingyce-macos-release.tar
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download: only its runs upload them)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: symbols-macos-release
          path: dist/chupathingyce-macos-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/macos/third_party
          key: macos-sdl3-${{ hashFiles('tools/android_build.py', 'tools/macos_build.py', 'tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/bgfx
          key: bgfx-source-${{ runner.os }}-${{ hashFiles('tools/bgfx_build.py', 'tools/bgfx-patches/**') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}

  ci-ok:
    # The run in one check: green when every job that had to run passed. A
    # platform job left out by the plan job counts as passed on a fast
    # check, never on a full run; FreeBSD's may fail on a run started with
    # workflow_dispatch, as its job allows (continue-on-error). Not required
    # to merge: a release's run is checked job by job before anything ships
    # (ChupathingyCE/command, tools/public_build.py).
    needs: [gate, plan, info, linux, linux-tests, linux-big-endian, linux64, freebsd64, server, server-container,
            server-windows, android64, windows, windows64, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.plan.outputs.full }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "full matrix: ${FULL:-unknown}"
          jq -e --arg full "$FULL" --arg event "$EVENT" '
            ["linux64", "freebsd64", "server", "server-container", "server-windows", "android64",
             "windows", "windows64", "macos"] as $platforms
            | to_entries | all(
                .value.result == "success"
                or (.key == "info" and $event != "workflow_dispatch" and .value.result == "skipped")
                or ($full == "false" and .value.result == "skipped" and (.key | IN($platforms[])))
                or (.key == "freebsd64" and $event == "workflow_dispatch" and .value.result == "failure"))' \
            <<< "$NEEDS" > /dev/null

  cache-prune:
    # After a push to main, once its jobs have saved their caches: main's
    # older generations of each cache (a key that ends in a commit or a
    # file hash, ccache-linux-ubuntu-clang22-<commit> say) are deleted, and
    # every cache a pull request left (refs/pull/...). main's newest of
    # each is always kept, and any other cache (a release branch's, a key
    # without a hash) is left alone, so the repository stays under its
    # 10 GB and main's compile caches are not the ones evicted.
    needs: [gate, linux, linux64, freebsd64, server, server-windows, android64, windows, windows64, macos]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ChupathingyCE/chupathingyce' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PRUNE'
          import json, os, re, subprocess
          repository = os.environ["REPOSITORY"]
          listed = subprocess.run(["gh", "api", "--paginate", f"repos/{repository}/actions/caches?per_page=100",
                                   "--jq", ".actions_caches[]"], check=True, capture_output=True, text=True).stdout
          caches = [json.loads(line) for line in listed.splitlines() if line.strip()]
          # (the key's last part: a commit, 40 hex digits, or hashFiles', 64)
          generation = re.compile(r"^(.+-)[0-9a-f]{40}(?:[0-9a-f]{24})?$")
          newest = {}
          for cache in caches:
              match = generation.match(cache["key"])
              if cache["ref"] == "refs/heads/main" and match:
                  kept = newest.get(match.group(1))
                  if kept is None or (cache["created_at"], cache["id"]) > (kept["created_at"], kept["id"]):
                      newest[match.group(1)] = cache
          drop = []
          for cache in caches:
              match = generation.match(cache["key"])
              if cache["ref"].startswith("refs/pull/"):
                  drop.append((cache, "a pull request's"))
              elif cache["ref"] == "refs/heads/main" and match and newest[match.group(1)]["id"] != cache["id"]:
                  drop.append((cache, f"older than {newest[match.group(1)]['key']}"))
          freed = 0
          for cache, why in drop:
              # (never main's newest of a kind, whatever the lists above say)
              assert not any(cache["id"] == kept["id"] for kept in newest.values())
              size = cache.get("size_in_bytes", 0)
              result = subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repository}/actions/caches/{cache['id']}"],
                                      capture_output=True, text=True)
              if result.returncode == 0:
                  freed += size
                  print(f"deleted {cache['key']} ({cache['ref']}, {size // 2**20} MB): {why}")
              else:
                  print(f"::warning::could not delete {cache['key']}: {result.stderr.strip()}")
          kept_size = sum(cache.get("size_in_bytes", 0) for cache in caches) - freed
          print(f"freed {freed // 2**20} MB; {kept_size // 2**20} MB of caches left")
          PRUNE
