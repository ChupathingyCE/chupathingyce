name: Build

# Debug and release builds of the native ports (Linux and Windows, 32- and
# 64-bit, Android (native 64-bit), macOS, FreeBSD), and release builds of the dedicated server (Linux
# x86, x64 and arm64, and Windows x64) and its container, for every pushed commit and pull
# request, uploaded as artifacts: whether a change builds. tools/ci_build.py does each build; see it for the options.
#
# These builds are VERSION's -dev, and never look for updates. Releases and
# nightlies are built here too, by hand or by ChupathingyCE's release
# workflows (ChupathingyCE/command), which run this workflow on main with a
# commit and its version (tools/version.py): the builds are that commit's,
# as that version, and a release's look for newer releases. Those workflows
# then sign the Android app with ChupathingyCE's key (this repository has no
# key: the debug app has the runner's debug key, the release app is
# unsigned) and publish the builds to this repository's Releases. Each run
# also uploads chupathingyce-build-info: the commit and version it built.
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle,
#   the Linux builds' system roots) are cached too;
# - pushes build only release branches and tags, not main: a commit reaches
#   main through a pull request whose Build passed, and the nightly, the
#   releases and the test builds start their own run (workflow_dispatch);
#   every other branch builds through its pull request;
# - debug builds only in runs started with workflow_dispatch and on tags;
#   pull requests build release only (BUILD_DEBUG);
# - a newer commit to a pull request or a release branch cancels its run
#   still going; runs on main (started with workflow_dispatch) are never
#   canceled;
# - changes that only touch documentation do not build (no check is
#   required to merge, so a pull request without a Build is not blocked);
# - the caches (compiles, downloads) are saved only by a run of main's own
#   head that builds no version: the daily run on main (schedule) and a
#   test build started on main without a commit. Pull requests and other
#   branches restore main's newest and keep nothing of their own, so they
#   do not crowd main's out of the repository's 10 GB of caches;
# - a release's, a testing build's or a nightly's run (one started with a
#   version: what gets signed) restores no cache and saves none: it builds
#   from a clean checkout and fresh downloads, whatever a cache holds;
# - a run started with a commit builds it only when that commit is on main
#   or on a release branch (the gate job), never another commit of the
#   repository's network (a fork's pull request, say), so a run on main
#   never builds code that is not ChupathingyCE's own;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - artifacts are kept for three days.
on:
  push:
    branches:
      - "release-*"
      - "release/**"
    tags:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  # (main's head each day, which keeps main's caches fresh for the pull
  # requests: the only regular run that saves them)
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build (a full SHA on main or a release-* branch; empty, the branch's)
        type: string
        default: ""
      version:
        description: The version (0.5.0b, 0.5.0b-nightly.42; empty, VERSION's -dev)
        type: string
        default: ""
      release:
        description: A release's build (its updater looks for newer releases; the version must be VERSION's)
        type: boolean
        default: false
      request:
        description: An ID that the caller finds this run by (in its name)
        type: string
        default: ""

# (a run started with a version is named for it, so that the release
# workflows find their run; the others keep GitHub's name)
run-name: ${{ inputs.version && format('Build {0} at {1} {2}', inputs.version, inputs.commit, inputs.request) || '' }}

# (a run started by hand is never canceled by a push, and cancels none; a
# push to main or a tag has a group of its own, so none is canceled or left
# waiting; a pull request's or a release branch's newer run cancels the last)
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}', github.run_id) || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && format('build-{0}-{1}', github.ref, github.sha) || format('build-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # (empty unless started with a version: VERSION's -dev, tools/version.py)
  HALO_VERSION: ${{ inputs.version }}
  HALO_RELEASE_BUILD: ${{ inputs.release && '1' || '0' }}
  # debug builds only for releases, nightlies and test builds (a run started
  # with workflow_dispatch, as ChupathingyCE/command does) and tags; pull
  # requests build release only
  BUILD_DEBUG: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  # the caches (README of this file, "Kept cheap"): restored by every run
  # that builds no version; saved only by a run on main that builds main's
  # own head (no commit given, or that commit) and no version
  CACHE_RESTORE: ${{ inputs.version == '' && 'true' || 'false' }}
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' && inputs.version == '' && (inputs.commit == '' || inputs.commit == github.sha) && 'true' || 'false' }}

jobs:
  gate:
    # A run started with a commit (workflow_dispatch's inputs.commit) builds
    # it only when it is a full SHA in the history of main or of a release
    # branch (release-*) of this repository. GitHub checks out
    # any commit of the repository's network, a fork's unmerged pull request
    # included, and every other job waits for this one.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The commit is main's or a release branch's
        if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
        env:
          COMMIT: ${{ inputs.commit }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          case "$COMMIT" in
            *[!0123456789abcdef]*) echo "::error::commit is not a full SHA (40 hex digits, lower case)"; exit 1 ;;
          esac
          [ "${#COMMIT}" -eq 40 ] || { echo "::error::commit is not a full SHA (40 hex digits, lower case)"; exit 1; }
          # (the branches' history, commits only: no trees, no files)
          git init -q gate
          cd gate
          # (one retry: a GitHub hiccup should not fail a release's build)
          fetch() {
            git fetch -q --filter=tree:0 "$REPOSITORY" \
              '+refs/heads/main:refs/gate/main' \
              '+refs/heads/release-*:refs/gate/release-*'
          }
          fetch || { echo "fetch failed; trying again in 10 seconds"; sleep 10; fetch; }
          for branch in $(git for-each-ref --format='%(refname)' refs/gate); do
            if git merge-base --is-ancestor "$COMMIT" "$branch" 2>/dev/null; then
              echo "$COMMIT is on ${branch#refs/gate/}"
              exit 0
            fi
          done
          echo "::error::$COMMIT is not on main or a release branch: this workflow builds only ChupathingyCE's own commits"
          exit 1

  info:
    needs: gate
    # what this run builds: the commit (inputs.commit, else the run's) and
    # the version, which the release workflows check before they publish
    # its builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Build info
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUEST: ${{ inputs.request }}
        run: |
          mkdir -p dist/chupathingyce-build-info
          python3 - > dist/chupathingyce-build-info/build-info.json <<'EOF'
          import json, os, subprocess
          from tools.version import release_build, version
          print(json.dumps({
              "commit": subprocess.run(["git", "rev-parse", "HEAD"], check=True, capture_output=True,
                                       text=True).stdout.strip(),
              "version": version(),
              "release": release_build(),
              "event": os.environ["EVENT"],
              "ref": os.environ["REF"],
              "request": os.environ["REQUEST"],
          }, indent=2))
          EOF
          cat dist/chupathingyce-build-info/build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-build-info
          path: dist/chupathingyce-build-info
          retention-days: 3

  linux:
    needs: gate
    # Ubuntu 24.04 with clang 22 from apt.llvm.org (the profile-guided
    # optimisation in pgo/ needs that major version; its bin directory goes
    # first on PATH, so that clang, ld.lld and llvm-profdata are clang 22's
    # rather than the runner's), and CMake, pkg-config and wayland-scanner
    # for the SDL 3 that the portable build brings. The build links against
    # Debian 11's 32-bit glibc 2.31 (tools/linux_sysroot.py), not Ubuntu's,
    # so that it starts on older distributions; Ubuntu's 32-bit glibc
    # (gcc-multilib) is for the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        timeout-minutes: 15
        run: |
          # (apt fails fast and retries: a mirror that stalls has hung a run
          # for more than 15 minutes; each try is also cut off by timeout)
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-fail-fast > /dev/null
          apt_try() {
            for attempt in 1 2 3; do
              sudo timeout 300 "$@" && return 0
              echo "apt: try $attempt of $* failed" >&2
              sleep 10
            done
            return 1
          }
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL --retry 3 --max-time 60 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_try apt-get update -q
          apt_try apt-get install -y -q --no-install-recommends clang-$LLVM_MAJOR lld-$LLVM_MAJOR llvm-$LLVM_MAJOR \
            libclang-rt-$LLVM_MAJOR-dev gcc gcc-multilib libc6-dev-i386 cmake pkg-config libwayland-bin \
            ninja-build ccache python3-pytest zstd
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
        env:
          LLVM_MAJOR: 22

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py linux debug

      - name: Release
        run: python3 tools/ci_build.py linux release

      # (no executable or library that needs a newer glibc than the system
      # root's: tools/linux_glibc_check.py)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py $([ "$BUILD_DEBUG" = true ] && echo dist/chupathingyce-linux-debug) dist/chupathingyce-linux-release

      # (Delta's wire on a big-endian machine, as the Xbox 360 and Wii U are:
      # tools/test_delta_big_endian.py, under QEMU; and structure culling's
      # reads of the map's vertices there)
      - name: Delta on big-endian
        timeout-minutes: 15
        run: |
          # (apt fails fast and retries: a mirror that stalls has hung a run
          # for more than 15 minutes; each try is also cut off by timeout)
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-fail-fast > /dev/null
          apt_try() {
            for attempt in 1 2 3; do
              sudo timeout 300 "$@" && return 0
              echo "apt: try $attempt of $* failed" >&2
              sleep 10
            done
            return 1
          }
          apt_try apt-get install -y -q --no-install-recommends gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/test_delta_big_endian.py tools/test_vertex_byte_order.py -rs
          # (the shader key lists read the same on a big-endian machine)
          if [ -f tools/test_shader_keys.py ]; then
            DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/test_shader_keys.py -rs
          fi
          # (structure culling from the Xbox's vertex bytes, #925)
          if [ -f tools/harness/tests/test_structure_culling_byte_order.py ]; then
            DELTA_BE_REQUIRED=1 python3 -m pytest -q tools/harness/tests/test_structure_culling_byte_order.py -rs
          fi

      # (the self-updater from end to end, against the 32-bit SDL 3 the
      # release step built in build/linux: tools/test_update_install.py;
      # UPDATE_INSTALL_REQUIRED, so that a missing piece fails, never skips)
      - name: The updater, end to end
        env:
          HALO_UPDATE_TEST_SDL: build/linux
          UPDATE_INSTALL_REQUIRED: "1"
        run: |
          if [ -f tools/test_update_install.py ]; then
            python3 -m pytest -q -rs tools/test_update_install.py
          else
            echo "::notice::tools/test_update_install.py: not in this commit"
          fi

      # (HALO_SANITIZERS_REQUIRED: a test without its sanitizers' runtime or
      # libFuzzer fails here, where clang's runtimes are installed, instead of
      # building unsanitized or skipping; tools/fuzz_support.py)
      - name: Test
        env:
          HALO_SANITIZERS_REQUIRED: "1"
        run: |
          # (a release branch's commit, built with main's workflow, may not have
          # every test main has yet: those are left out)
          tests=""; for test in tools/test_host_fuzz.py tools/test_map_fuzz.py tools/test_linux_port.py tools/test_android_asm_convert.py tools/test_touch_menu.py tools/test_ui_point.py tools/test_p2p_copies.py tools/test_p2p_host_port.py tools/test_p2p_signal_sockets.py tools/test_ping.py tools/test_save_folder.py tools/test_packaged_install.py tools/test_server_control.py tools/test_server_roles.py tools/test_delta.py tools/test_delta_peer.py tools/test_delta_compat.py tools/test_network_rules.py tools/test_map_download.py tools/test_playlist_maps.py tools/test_map_families.py tools/test_ce_resource_maps.py tools/test_map_packs.py tools/test_map_report.py tools/test_event_log.py tools/test_update_manifest.py tools/test_update_channels.py tools/test_rename_stub.py tools/test_gamespy_listing.py tools/test_ce_joins.py tools/test_determinism.py tools/test_ce_effect_flags.py tools/test_console_light_limits.py tools/test_console_meter_stages.py tools/test_console_host_players.py tools/test_online_games_list.py tools/test_campaign_levels.py tools/test_player_profile_list.py tools/test_http_url_rules.py tools/test_host_cheats.py tools/test_vote_notice.py tools/test_lobby_budget.py tools/test_line_of_sight.py tools/test_host_console_objects.py tools/test_host_evidence.py tools/test_address_limit.py tools/test_conduct_rules.py tools/test_tricks.py tools/test_coop_spectate.py tools/test_discord_activity.py tools/test_social.py tools/test_delta_input_rules.py tools/test_delta_menu_art.py tools/test_identity.py tools/test_player_key.py tools/test_discord_register.py tools/test_link_register.py tools/test_kcp_peer.py tools/test_kcp_flush.py tools/test_late_join_wait.py tools/test_server_bans.py tools/test_report_clip.py tools/test_party_teams.py tools/test_server_badge.py tools/test_medal_rules.py tools/test_log_paths.py tools/test_map_share.py tools/test_map_host_download.py tools/test_console_gl_check.py tools/test_map_repo.py tools/test_launcher_start.py tools/test_build_workflow.py tools/test_capture.py tools/test_bgfx_formats.py tools/test_config_console_replace.py tools/test_prompt_schemes.py tools/test_tag_swap_tables.py; do
            if [ -f "$test" ]; then tests="$tests $test"; else echo "::notice::$test: not in this commit"; fi
          done
          python3 -m pytest -q $tests
          # (the asset-free tests of the engine's own functions, tools/harness;
          # the three left out were written against code of ours that has
          # changed since, and wait to be brought up to date)
          if [ -f tools/harness/__init__.py ]; then
            python3 -m pytest -q tools/harness \
              --ignore=tools/harness/tests/test_elevator_prediction.py \
              --ignore=tools/harness/tests/test_server_teardown.py \
              --ignore=tools/harness/tests/test_stale_player_damage.py
          fi
          python3 tools/test_light_storage.py
          python3 tools/test_saved_game_script_globals.py
          python3 tools/test_rendered_lights_storage.py
          python3 tools/test_port_config.py
          python3 tools/test_tick_input.py
          python3 tools/test_audio_doppler.py
          python3 tools/test_controller_layout.py
          python3 tools/test_button_mappings.py
          python3 tools/test_menu_key_caps.py
          python3 tools/test_split_screen_input.py
          python3 tools/test_local_player_quit.py
          python3 tools/test_tag_byte_swap.py
          python3 tools/test_bitmap_byte_order.py
          python3 -m pytest -q tools/test_console_link.py
          python3 -m pytest -q tools/test_console_claims.py
          python3 -m pytest -q tools/test_console_gates.py
          python3 tools/test_console_https.py
          if [ -f tools/test_picture_check.py ]; then python3 -m pytest -q tools/test_picture_check.py; fi

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-linux-debug
          path: dist/chupathingyce-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux-release
          path: dist/chupathingyce-linux-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-release
          path: dist/chupathingyce-linux-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-linux-ubuntu-clang22-${{ github.sha }}

  linux64:
    needs: gate
    # The native 64-bit Linux build (ninja linux64), on Ubuntu with clang 22
    # as the 32-bit one, and portable as it is: against Debian 11's amd64
    # glibc 2.31, with the SDL 3 it brings (tools/linux_sysroot.py --arch
    # amd64).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        timeout-minutes: 15
        run: |
          # (apt fails fast and retries: a mirror that stalls has hung a run
          # for more than 15 minutes; each try is also cut off by timeout)
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-fail-fast > /dev/null
          apt_try() {
            for attempt in 1 2 3; do
              sudo timeout 300 "$@" && return 0
              echo "apt: try $attempt of $* failed" >&2
              sleep 10
            done
            return 1
          }
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL --retry 3 --max-time 60 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_try apt-get update -q
          apt_try apt-get install -y -q --no-install-recommends clang-$LLVM_MAJOR lld-$LLVM_MAJOR llvm-$LLVM_MAJOR \
            gcc cmake pkg-config libwayland-bin ninja-build ccache zstd
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
        env:
          LLVM_MAJOR: 22

      - name: Toolchain versions
        run: |
          clang --version | head -n 1
          ld.lld --version
          llvm-profdata --version | head -n 2
          cmake --version | head -n 1
          ccache --version | head -n 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}
          restore-keys: ccache-linux64-ubuntu-clang22-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/linux64/third_party
          key: linux64-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      # bgfx's, bx's and bimg's sources, which the build fetches for the bgfx
      # renderer (tools/bgfx_build.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py linux64 debug

      - name: Release
        run: python3 tools/ci_build.py linux64 release

      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py $([ "$BUILD_DEBUG" = true ] && echo dist/chupathingyce-linux64-debug) dist/chupathingyce-linux64-release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-linux64-debug
          path: dist/chupathingyce-linux64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-linux64-release
          path: dist/chupathingyce-linux64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux64-release
          path: dist/chupathingyce-linux64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/linux64/third_party
          key: linux64-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/bgfx
          key: bgfx-source-${{ hashFiles('tools/bgfx_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-linux64-ubuntu-clang22-${{ github.sha }}

  freebsd64:
    needs: gate
    # The native 64-bit FreeBSD build (ninja freebsd64, port/unix: Renkoto's
    # port), built on FreeBSD 15.1 itself, in a virtual machine on Ubuntu
    # (vmactions/freebsd-vm, pinned to a commit: QEMU with the runner's KVM;
    # the checkout synced in with rsync and dist/ back out). Cross-compiling
    # from Linux would need a FreeBSD system root with the ports' SDL3 and a
    # build that names its host apart from the machine it runs on; the
    # virtual machine builds as a FreeBSD player does, with the base
    # system's clang and the packages, for a few minutes of start-up. Its
    # SDL3 is the system's package, not brought along.
    #
    # A release's or a nightly's run (started by hand) does not fail when
    # this job does: the other platforms are still published, without
    # FreeBSD's (ChupathingyCE/command takes it when it is there). A commit
    # from before the port has none.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      FREEBSD_RELEASE: "15.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Has it
        id: has
        run: |
          if [ -f tools/unix64_build.py ]; then
            echo "freebsd64=true" >> "$GITHUB_OUTPUT"
            # (git in the virtual machine may not read the synced checkout)
            echo "HALO_COMMIT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          else
            echo "::notice::no FreeBSD build at this commit (ninja freebsd64): skipped"
          fi

      # (restored and saved as the other jobs' are)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true' && steps.has.outputs.freebsd64 == 'true'
        with:
          path: .ccache
          key: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-${{ github.sha }}
          restore-keys: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-

      # the FFmpeg source tarball (tools/download.py)
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true' && steps.has.outputs.freebsd64 == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - name: Debug and release, on FreeBSD
        if: steps.has.outputs.freebsd64 == 'true'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          usesh: true
          sync: rsync
          envs: "BUILD_DEBUG HALO_VERSION HALO_RELEASE_BUILD HALO_COMMIT CI_COMPILER_LAUNCHER CCACHE_DIR CCACHE_BASEDIR CCACHE_MAXSIZE"
          prepare: |
            pkg install -y python3 ninja pkgconf sdl3 gmake llvm ccache
          run: |
            set -e
            freebsd-version
            cc --version | head -n 1
            if [ "$BUILD_DEBUG" = true ]; then python3 tools/ci_build.py freebsd64 debug; fi
            python3 tools/ci_build.py freebsd64 release
            ccache --show-stats
            # (only dist/, the compile cache and the downloads come back)
            rm -rf build/freebsd64

      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.freebsd64 == 'true' && env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-freebsd64-debug
          path: dist/chupathingyce-freebsd64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.freebsd64 == 'true'
        with:
          name: chupathingyce-freebsd64-release
          path: dist/chupathingyce-freebsd64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.freebsd64 == 'true'
        with:
          name: symbols-freebsd64-release
          path: dist/chupathingyce-freebsd64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' && steps.has.outputs.freebsd64 == 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && steps.has.outputs.freebsd64 == 'true' && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-freebsd64-${{ env.FREEBSD_RELEASE }}-${{ github.sha }}

  server:
    needs: gate
    # The dedicated server (tools/server_build.py): one static program for
    # each architecture, built against musl in Alpine Linux's container of
    # that architecture (tools/ci_build.py --alpine; x86 on the x86-64
    # runner, arm64 on GitHub's arm64 one), then started on the runner's
    # Ubuntu, which it shares nothing with: it prints its version, refuses
    # to start without a playlist, and stops with a clear error without maps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-server-${{ matrix.arch }}-

      # SDL's headers, which configure.py fetches
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/server/third_party
          key: server-third-party-${{ matrix.arch }}-${{ hashFiles('tools/server_build.py') }}

      - name: Release
        run: python3 tools/ci_build.py server-${{ matrix.arch }} release --alpine

      # (static, against musl: no glibc version, and no library, to need)
      - name: glibc 2.31
        run: python3 tools/linux_glibc_check.py --static dist/chupathingyce-server-linux-${{ matrix.arch }}

      - name: Start it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          server="$smoke/chupathingyce-server"
          mkdir -p "$smoke/data/playlists"
          cp dist/chupathingyce-server-linux-${{ matrix.arch }}/chupathingyce-server "$server"
          file "$server"
          # (a release's download is without its debug information)
          if file "$server" | grep -q "with debug_info"; then echo "not stripped"; exit 1; fi
          "$server" --version
          # no playlist: how to start one, and status 2
          status=0; "$server" || status=$?
          test "$status" = 2
          # a playlist, but no maps: a clear error, and status 1
          echo "bloodgulch slayer" > "$smoke/data/playlists/test.txt"
          status=0
          HALO_DATA_ROOT="$smoke/data" HALO_SAVE_ROOT="$smoke/saves" HALO_DEDICATED=playlists/test.txt \
            HALO_NET_ONLINE=false HALO_NET_LIST_GAMES=false \
            timeout 60 "$server" 2> "$smoke/error.txt" || status=$?
          cat "$smoke/error.txt"
          test "$status" = 1
          grep -q "no maps" "$smoke/error.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-server-linux-${{ matrix.arch }}
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-server-linux-${{ matrix.arch }}-release
          path: dist/chupathingyce-server-linux-${{ matrix.arch }}-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/server/third_party
          key: server-third-party-${{ matrix.arch }}-${{ hashFiles('tools/server_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-server-${{ matrix.arch }}-${{ github.sha }}

  server-container:
    # The server's container (server/deploy/Dockerfile) for the three
    # architectures at once, from the server job's programs, as buildx makes
    # it (nothing runs while it builds); then each started once, as above
    # (arm64 emulated). Not pushed anywhere: server-image.yml pushes each
    # release's and the nightly's, from their published servers.
    needs: [gate, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: chupathingyce-server-linux-*
          path: artifacts

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          context="$RUNNER_TEMP/context"
          mkdir -p "$context"
          cp server/deploy/Dockerfile "$context/"
          for pair in x86:386 x64:amd64 arm64:arm64; do
            arch=${pair%%:*}; platform=${pair#*:}
            mkdir -p "$context/bin/$platform"
            cp "artifacts/chupathingyce-server-linux-$arch/chupathingyce-server" "$context/bin/$platform/"
            chmod +x "$context/bin/$platform/chupathingyce-server"
          done
          docker buildx build --platform linux/386,linux/amd64,linux/arm64 \
            --output type=oci,dest="$RUNNER_TEMP/chupathingyce-server.oci.tar" "$context"
          ls -l "$RUNNER_TEMP/chupathingyce-server.oci.tar"

      - name: Start each
        run: |
          for platform in 386 amd64 arm64; do
            docker buildx build --platform linux/$platform --load -t chupathingyce-server:$platform "$RUNNER_TEMP/context"
            docker run --rm --platform linux/$platform --cap-drop ALL --security-opt no-new-privileges \
              chupathingyce-server:$platform --version
            # (not root)
            test "$(docker image inspect -f '{{.Config.User}}' chupathingyce-server:$platform)" = 1000:1000
          done
          docker image ls chupathingyce-server

  server-windows:
    needs: gate
    # The dedicated server for 64-bit Windows (ninja server-windows64;
    # tools/windows_build.py), a console program with no SDL, packaged as
    # chupathingyce-server-windows-x64 with start-server.bat and its README
    # (server/windows); then started as the server job starts the Linux
    # ones, and installed, started and taken out once as a Windows service
    # (the runner's user is an administrator). Release only, as the Linux
    # servers.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-server-windows64-${{ github.sha }}
          restore-keys: ccache-server-windows64-

      # SDL's development package, which configure.py fetches (its headers
      # only, for the server)
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Release
        run: python tools/ci_build.py server-windows64 release

      - name: Compile cache
        run: ccache --show-stats

      - name: Start it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          server="$smoke/chupathingyce-server.exe"
          mkdir -p "$smoke/data/playlists"
          cp dist/chupathingyce-server-windows-x64/chupathingyce-server.exe "$server"
          ls dist/chupathingyce-server-windows-x64
          test -f dist/chupathingyce-server-windows-x64/start-server.bat
          test -f dist/chupathingyce-server-windows-x64/README.txt
          # (no SDL, nothing beside it to load)
          if objdump -p "$server" 2>/dev/null | grep -i "DLL Name" | grep -i sdl; then echo "links SDL"; exit 1; fi
          "$server" --version
          # no playlist: how to start one, and status 2
          status=0; "$server" || status=$?
          test "$status" = 2
          # --service, not started by the service manager: status 2
          status=0; "$server" --service 2> "$smoke/service.txt" || status=$?
          cat "$smoke/service.txt"
          test "$status" = 2
          # a playlist, but no maps: a clear error, and status 1
          echo "bloodgulch slayer" > "$smoke/data/playlists/test.txt"
          status=0
          HALO_DATA_ROOT="$(cygpath -w "$smoke/data")" HALO_SAVE_ROOT="$(cygpath -w "$smoke/saves")" \
            HALO_DEDICATED=playlists/test.txt HALO_NET_ONLINE=false HALO_NET_LIST_GAMES=false \
            timeout 60 "$server" 2> "$smoke/error.txt" < /dev/null || status=$?
          cat "$smoke/error.txt"
          test "$status" = 1
          grep -q "no maps" "$smoke/error.txt"

      - name: As a service
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "service-data"
          New-Item -ItemType Directory -Force (Join-Path $data "playlists") | Out-Null
          Copy-Item dist/chupathingyce-server-windows-x64/chupathingyce-server.exe $data
          Set-Content (Join-Path $data "playlists/test.txt") "bloodgulch slayer"
          Set-Location $data
          $env:HALO_DEDICATED = "playlists\test.txt"
          $env:HALO_NET_ONLINE = "false"
          $env:HALO_NET_LIST_GAMES = "false"
          & .\chupathingyce-server.exe --install-service ChupathingySmoke
          if ($LASTEXITCODE -ne 0) { throw "--install-service: $LASTEXITCODE" }
          sc.exe qc ChupathingySmoke
          if (-not ((sc.exe qc ChupathingySmoke) -match "NT SERVICE\\ChupathingySmoke")) { throw "not its own account" }
          # (no maps: it starts, says so in its output file, and stops)
          $output = Join-Path $data "logs/server-output.txt"
          for ($i = 0; $i -lt 30 -and -not ((Test-Path $output) -and (Select-String -Quiet "no maps" $output)); $i++) { Start-Sleep 1 }
          Get-Content $output -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet "no maps" $output)) { throw "the service did not run the server" }
          & .\chupathingyce-server.exe --uninstall-service ChupathingySmoke
          if ($LASTEXITCODE -ne 0) { throw "--uninstall-service: $LASTEXITCODE" }
          sc.exe query ChupathingySmoke
          if ($LASTEXITCODE -eq 0) { throw "the service is still there" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-server-windows-x64
          path: dist/chupathingyce-server-windows-x64
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-server-windows-x64-release
          path: dist/chupathingyce-server-windows-x64-release-symbols
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-server-windows64-${{ github.sha }}

  android64:
    needs: gate
    # The native 64-bit Android app (ninja android64; tools/android64_build.py):
    # the Android download (the 32-bit-address app is no longer built here;
    # its code stays in port/android).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-android64-${{ github.sha }}
          restore-keys: ccache-android64-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # musl and SDL, which configure.py fetches
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # (no keystore.properties here, as in the android job: the debug app
      # has the runner's debug key, the release app is unsigned)
      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python3 tools/ci_build.py android64 debug

      - name: Release
        run: python3 tools/ci_build.py android64 release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-android64-debug-testkey
          path: dist/chupathingyce-android64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-android64-release-unsigned
          path: dist/chupathingyce-android64-release
          retention-days: 3

      # (kept by ChupathingyCE's release, not a download)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-android64-release
          path: dist/chupathingyce-android64-release-symbols
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-android64-${{ github.sha }}

  windows:
    needs: gate
    # The runner image has LLVM, Python, MSYS2 (the movies' FFmpeg builds
    # under its shell) and Visual Studio's x86 libraries and Windows SDK.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # (restored by a run without a version, saved only by main's head:
      # other branches' and pull requests' runs start from main's and keep
      # nothing of their own)
      - uses: actions/cache/restore@v4
        if: env.CACHE_RESTORE == 'true'
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # the FFmpeg source tarball (tools/download.py): kept so most runs fetch nothing
      - uses: actions/cache/restore@v4
        id: cache-1
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      # SDL's development package, which configure.py fetches
      - uses: actions/cache/restore@v4
        id: cache-2
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      # the movies' FFmpeg (tools/ffmpeg_build.py), built once and cached:
      # its configure and make run under the runner's MSYS2, which needs make
      - name: MSYS2 make
        run: /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed make diffutils

      - uses: actions/cache/restore@v4
        id: cache-3
        if: env.CACHE_RESTORE == 'true'
        with:
          path: build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - name: Debug
        if: env.BUILD_DEBUG == 'true'
        run: python tools/ci_build.py windows debug

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Test light storage
        run: |
          python tools/test_light_storage.py
          python tools/test_rendered_lights_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: chupathingyce-windows-debug
          path: dist/chupathingyce-windows-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-windows-release
          path: dist/chupathingyce-windows-release
          retention-days: 3

      # (halo.exe's symbols and map, which ChupathingyCE's release keeps
      # privately for the crash reports; not published)
      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEBUG == 'true'
        with:
          name: symbols-windows-debug
          path: dist/chupathingyce-windows-debug-symbols
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows-release
          path: dist/chupathingyce-windows-release-symbols
          retention-days: 3

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-1.outputs.cache-hit != 'true' }}
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-2.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' && steps.cache-3.outputs.cache-hit != 'true' }}
        with:
          path: build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache/save@v4
        if: ${{ success() && env.CACHE_SAVE == 'true' }}
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}

