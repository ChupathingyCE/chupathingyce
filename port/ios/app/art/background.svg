<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2000" width="1200" height="2000">
  <!-- the launcher's background: an original night scene (a made-up garage
  and the icon's made-up armoured buggy), dark enough for the cards on top -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1216"/>
      <stop offset="0.6" stop-color="#141d22"/>
      <stop offset="1" stop-color="#0d1114"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0507a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0507a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7440"/>
      <stop offset="1" stop-color="#36481f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="2000" fill="url(#night)"/>

  <!-- the skyline -->
  <g fill="#10181c">
    <rect x="0" y="980" width="140" height="520"/><rect x="150" y="900" width="110" height="600"/>
    <rect x="270" y="1040" width="160" height="460"/><rect x="760" y="940" width="130" height="560"/>
    <rect x="900" y="1010" width="120" height="490"/><rect x="1030" y="880" width="170" height="620"/>
  </g>
  <g fill="#e6c36a" opacity="0.35">
    <rect x="30" y="1030" width="18" height="24"/><rect x="80" y="1100" width="18" height="24"/>
    <rect x="180" y="960" width="18" height="24"/><rect x="220" y="1060" width="18" height="24"/>
    <rect x="300" y="1100" width="18" height="24"/><rect x="380" y="1160" width="18" height="24"/>
    <rect x="790" y="1000" width="18" height="24"/><rect x="840" y="1090" width="18" height="24"/>
    <rect x="930" y="1060" width="18" height="24"/><rect x="1070" y="940" width="18" height="24"/>
    <rect x="1140" y="1040" width="18" height="24"/>
  </g>

  <!-- the garage, its neon sign glowing -->
  <rect x="420" y="1060" width="360" height="440" fill="#1b2328"/>
  <rect x="470" y="1260" width="260" height="240" fill="#0c1114"/>
  <g stroke="#2a3439" stroke-width="6">
    <line x1="470" y1="1310" x2="730" y2="1310"/><line x1="470" y1="1360" x2="730" y2="1360"/>
    <line x1="470" y1="1410" x2="730" y2="1410"/><line x1="470" y1="1460" x2="730" y2="1460"/>
  </g>
  <ellipse cx="600" cy="1150" rx="320" ry="150" fill="url(#glow)"/>
  <rect x="430" y="1100" width="340" height="110" rx="18" fill="none" stroke="#e0507a" stroke-width="8"/>
  <text x="600" y="1145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
    font-size="44" fill="#ff8fb0">Gabagool</text>
  <text x="600" y="1192" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="36" letter-spacing="8" fill="#ffd36a">GARAGE</text>

  <!-- the street -->
  <rect x="0" y="1500" width="1200" height="500" fill="#0a0e10"/>
  <g fill="#2b3236"><rect x="80" y="1720" width="140" height="14"/><rect x="380" y="1720" width="140" height="14"/>
    <rect x="680" y="1720" width="140" height="14"/><rect x="980" y="1720" width="140" height="14"/></g>

  <!-- the buggy, parked, from the side -->
  <g transform="translate(150 1420)">
    <path d="M60 260 L120 150 L250 150 L300 90 L620 90 L700 150 L820 160 L880 260 L860 300 L80 300 Z" fill="url(#hull)"/>
    <path d="M300 90 L340 30 L600 30 L620 90" fill="none" stroke="#2d3a20" stroke-width="22" stroke-linejoin="round"/>
    <g fill="#26301b"><rect x="380" y="170" width="200" height="20" rx="6"/><rect x="380" y="206" width="200" height="20" rx="6"/></g>
    <circle cx="230" cy="300" r="78" fill="#151a1d"/><circle cx="230" cy="300" r="34" fill="#3a4246"/>
    <circle cx="700" cy="300" r="78" fill="#151a1d"/><circle cx="700" cy="300" r="34" fill="#3a4246"/>
    <circle cx="860" cy="200" r="16" fill="#f2e9a6"/>
    <g fill="#4a3b2a" opacity="0.7"><circle cx="120" cy="250" r="14"/><circle cx="520" cy="270" r="12"/><circle cx="800" cy="240" r="16"/></g>
  </g>
</svg>
