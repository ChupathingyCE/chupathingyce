# The app, as XcodeGen makes its Xcode project (`xcodegen generate` in app/,
# which .github/workflows/ios.yml runs on the macOS runner): a UIKit launcher
# in Swift that imports the game's data and starts the game, linked in from
# lib/libhalo.a (port/ios/build.py) with lib/libSDL3.a.
#
# Two apps: ChupathingyCE, for iPhone (iPhone Duo too) and iPad, which the
# Vision Pro runs as an iPad app (visionOS has no OpenGL ES of its own), and
# ChupathingyCE-tvOS, for the Apple TV. Sources/Shared is both's: the app,
# the importers and the downloader; Sources/iOS the iPhone's launcher (iPhone
# Duo's fold is the touch overlay's: port/ios/src/ios_touch.m), Sources/tvOS
# the TV's launcher and its upload page. The
# TV's game is its own build (lib-tvos/: ninja tvos).
name: ChupathingyCE
options:
  deploymentTarget:
    iOS: "16.4"
    tvOS: "16.4"
  createIntermediateGroups: true

targets:
  ChupathingyCE:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ChupathingyCE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        # the launcher turns with the device; the game asks SDL for landscape,
        # but on iPhone Duo's inner display any way up (ios_touch.m)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # (the game's window is the whole screen: no Split View)
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        # the data folder in the Files app (On My iPhone, ChupathingyCE)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        # invite links (halo://join/..., halo://key/...), opened from a
        # message or a page: the game joins them
        CFBundleURLTypes:
          - CFBundleURLName: dev.horrible.chupathingyce.invite
            CFBundleURLSchemes: [halo]
        # maps downloaded from the address the player gives, http:// too;
        # the game's own play over the local network
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          ChupathingyCE finds and joins games on your local network.
        NSBluetoothAlwaysUsageDescription: >-
          ChupathingyCE uses Bluetooth for game controllers.
    settings:
      base:
        PRODUCT_NAME: ChupathingyCE
        PRODUCT_BUNDLE_IDENTIFIER: dev.horrible.chupathingyce
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/Bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # the game and SDL3 (the workflow puts them in lib/); -ObjC for the
        # Objective-C classes of both, which nothing names until they run
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/lib"
        OTHER_LDFLAGS: ["-lhalo", "-lSDL3", "-ObjC"]
    # what SDL3 and the game need of iOS (port/ios/build.py, IOS_FRAMEWORKS)
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreBluetooth.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libiconv.tbd
      - sdk: libz.tbd

  ChupathingyCE-tvOS:
    type: application
    platform: tvOS
    sources:
      - Sources/Shared
      - Sources/tvOS
      - ResourcesTV
      # (the iPhone's art and internet play's files, the workflow's copies)
      - path: Resources/background.png
      - path: Resources/brokers.txt
        optional: true
      - path: Resources/cacert.pem
        optional: true
    info:
      path: Info-tvOS.plist
      properties:
        CFBundleDisplayName: ChupathingyCE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        # a controller is how the game is played (the remote is not one)
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        GCSupportsControllerUserInteraction: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.horrible.chupathingyce.invite
            CFBundleURLSchemes: [halo]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # the game's play over the local network, and the upload page
        # (UploadServer) a phone or computer sends the game's data to
        NSLocalNetworkUsageDescription: >-
          ChupathingyCE takes the game's data from your phone or computer, and finds and joins games on your
          local network.
        NSBluetoothAlwaysUsageDescription: >-
          ChupathingyCE uses Bluetooth for game controllers.
    settings:
      base:
        PRODUCT_NAME: ChupathingyCE
        PRODUCT_BUNDLE_IDENTIFIER: dev.horrible.chupathingyce
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/Bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/lib-tvos"
        OTHER_LDFLAGS: ["-lhalo", "-lSDL3", "-ObjC"]
    # what SDL3 and the game need of tvOS (port/ios/build.py, IOS_FRAMEWORKS
    # but CoreMotion)
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreBluetooth.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Network.framework
      - sdk: libiconv.tbd
      - sdk: libz.tbd
