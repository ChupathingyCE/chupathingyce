// Gradle project of the Android port; the native parts are built by
// `ninja android` from the repository root (see README.md here).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "halo-android"
include ":app"
// the native 64-bit build's app (app64), beside the guest build's: only
// when asked for (-Pnative64), as `ninja android64_apk` does, once
// `ninja android64` has built its libraries
if (startParameter.projectProperties.containsKey("native64")) {
    include ":app64"
}
